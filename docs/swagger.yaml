          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.NodeIATA'
        type: array
      id:
        type: string
      isObserver:
        description: true if this node is also a known observer
        type: boolean
      knownNeighborCount:
        type: integer
      lastAdvertAt:
        description: epoch ms, nil if no advert received
        type: integer
      lastSeen:
        description: epoch ms
        type: integer
      lat:
        description: decimal degrees, from advert AppData
        type: number
      lng:
        description: decimal degrees, from advert AppData
        type: number
      locationSource:
        description: '"advert" or "manual"'
        type: string
      meshmapper:
        allOf:
        - $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.MeshMapperRepeater'
        description: |-
          MeshMapper is what MeshMapper's repeater list says about this key; omitted when
          the import is off or MeshMapper doesn't list it.
      metadata:
        description: raw JSONB metadata
      minFirmwareVersion:
        description: derived from capability flags
        type: string
      name:
        type: string
      neighborIds:
        description: only populated when the list request opts in; see ?neighbors=true
        items:
          type: string
        type: array
      neighbors:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.NodeNeighbor'
        type: array
      nodeType:
        description: 1=companion, 2=repeater, 3=room_server, 4=sensor
        type: integer
      nodeTypeName:
        type: string
      observerId:
        description: UUID of the associated observer row, if any
        type: string
      possiblyForeign:
        description: |-
          PossiblyForeign compares a repeater's stored position with this server's
          configured IATA border union. Omitted when disabled, unknown, or not repeater.
        type: boolean
      publicKey:
        description: hex-encoded Ed25519 public key
        type: string
      radio:
        description: 'shorthand: "freqMhz,bwKhz,sf" e.g. "910.525,62.5,7"'
        type: string
      stale:
        description: |-
          Stale is true when the node hasn't been seen (last_seen) within the configured
          staleness window (default 24h; internal/config.ResolvedConfig.NodeStaleThreshold).
          Applies to every node type, unlike ClockDriftSeconds/ClockOutOfSync on Node, which
          are repeater/room-server only.
        type: boolean
      supportsMultibytePaths:
        description: firmware >= 1.14.0; detected via path hash size
        type: boolean
      supportsMultibyteTraces:
        description: firmware >= 1.11.0; detected via trace hash size
        type: boolean
