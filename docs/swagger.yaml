  /traces:
    get:
      parameters:
      - description: Filter by IATA code(s), comma-separated
        in: query
        name: iatas
        type: string
      - description: Filter by region slug
        in: query
        name: region
        type: string
      - description: Filter by region ID
        in: query
        name: regionId
        type: integer
      - description: Filter by the tag's first transport scope name
        in: query
        name: scope
        type: string
      - description: 'Filter by type: TRACE (any multi-hop packet) or PING (default:
          all)'
        in: query
        name: type
        type: string
      - description: Filter by first_heard_at >= since (epoch ms)
        in: query
        name: since
        type: integer
      - description: Filter by first_heard_at <= until (epoch ms)
        in: query
        name: until
        type: integer
      - description: lastHeardAt (epoch ms) of the last item; returns older tags
        in: query
        name: cursor
        type: integer
      - description: traceTag (hex) of the last item; with cursor, also returns later
          tags sharing that millisecond
        in: query
        name: cursorTag
        type: string
      - description: Max results (default 50); must be positive, values above 200
          are clamped
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
