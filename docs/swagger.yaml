      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ObservationPoint'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: 'The read took too long: retry after Retry-After seconds'
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: Hourly observation counts per IATA
      tags:
      - Stats
  /stats/observer-comparison:
    get:
      description: Counts distinct retained packet hashes with route type 0 or 1,
        using reception time in [since, until). onlyA, onlyB and both partition totalPackets
        (the union). Repeated receptions count once. These are reported receptions,
        not a measure of radio packet loss or continuous observer coverage.
      parameters:
      - description: First observer UUID
        in: query
        name: observerA
        required: true
        type: string
      - description: Second, distinct observer UUID
        in: query
        name: observerB
        required: true
        type: string
      - description: Inclusive start, epoch milliseconds (0 through 253402300799999)
        in: query
        name: since
        required: true
        type: integer
      - description: Exclusive end, epoch milliseconds; later than since
        in: query
        name: until
        required: true
        type: integer
      - description: Comma-separated reception IATA codes
        in: query
        name: iatas
        type: string
      - description: Region ID, expands to member IATAs
        in: query
        name: regionId
        type: integer
      - description: Region slug, expands to member IATAs
        in: query
        name: region
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ObserverComparison'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: Compare flood packets reported by two observers
      tags:
      - Stats
  /stats/overview:
    get:
      description: Summarises the 24 most recent hours that can have been rolled (an
        hour rolls about 95 minutes after it closes); since/until report that window.
        Packets count once per hour heard. Use /stats/series for sparklines.
      parameters:
      - description: Comma-separated IATA codes
        in: query
        name: iatas
        type: string
      - description: Filter by region ID, expands to member IATAs
        in: query
        name: regionId
        type: integer
      - description: Filter by region slug, expands to member IATAs
        in: query
        name: region
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.StatsOverview'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: 'The read took too long: retry after Retry-After seconds'
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: Network overview stats (last 24 rolled hours)
      tags:
      - Stats
  /stats/paths:
    get:
      description: Counts stored receptions in [since, until), at most 30 days. Hash
        widths count only validated nonempty ordinary header paths (1/2/3 bytes).
        Empty paths do not vote for a width. TRACE header paths contain signal readings
        and are separate. Missing payload type or inconsistent/unsupported path metadata
        is unclassified. The four categories partition total receptions. Flood paths
        accumulate entries; direct paths contain remaining entries, so counts do not
        measure distance or a complete traversed route. Both boundaries round down
        to UTC hours and the response reports that effective window. Reads the hourly
        path rollup; an hour appears only after it is rolled, about 95 minutes after
        it ends, and hours without data are omitted.
      parameters:
      - description: Inclusive start, epoch milliseconds (0 through 253402300799999)
        in: query
        name: since
        required: true
        type: integer
      - description: Exclusive end, epoch milliseconds; at most 30 days after since
        in: query
        name: until
        required: true
        type: integer
      - description: Comma-separated reception IATA codes
        in: query
        name: iatas
        type: string
      - description: Region ID, expands to member IATAs
        in: query
        name: regionId
        type: integer
      - description: Region slug, expands to member IATAs
        in: query
        name: region
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PathStats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: Received path-entry and hash-width distributions
      tags:
      - Stats
  /stats/payload-breakdown:
    get:
      parameters:
      - description: Comma-separated IATA codes
        in: query
        name: iatas
        type: string
      - description: Filter by region ID, expands to member IATAs
        in: query
        name: regionId
        type: integer
      - description: Filter by region slug, expands to member IATAs
        in: query
        name: region
        type: string
      - description: Start of window epoch ms (default last 24h)
        in: query
        name: since
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PayloadBreakdownItem'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: 'The read took too long: retry after Retry-After seconds'
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: Observation counts by payload type (last 24h by default)
      tags:
      - Stats
  /stats/radio-presets:
    get:
      parameters:
      - description: Filter by preset string e.g. 910.525,62.5,7
        in: query
        name: preset
        type: string
      - description: Comma-separated IATA codes
        in: query
        name: iatas
        type: string
      - description: Filter by region ID, expands to member IATAs
        in: query
        name: regionId
        type: integer
      - description: Filter by region slug, expands to member IATAs
        in: query
        name: region
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.RadioPreset'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: 'The read took too long: retry after Retry-After seconds'
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: Radio preset usage by IATA
      tags:
      - Stats
  /stats/scopes:
    get:
      description: 'Packets are those heard since the window start, each counted once
        per hour however many of the requested IATAs heard it. Observers and nodes
        are current memberships: observers filter by the IATA they last reported from,
        nodes by their IATA memberships. hourly splits packetCount by UTC hour and
        adds the distinct observers and advertising nodes active in the scope each
        hour (empty hours omitted; outage gaps come from /stats/series hour status).
        With filters, lists only manual scopes configured for a matching region and
        imported scopes whose current MeshMapper catalogue includes a matching IATA;
        those remain listed with zero counts. An empty region returns an empty array.'
      parameters:
      - description: Comma-separated IATA codes
        in: query
        name: iatas
        type: string
      - description: Single IATA code; used when iatas is absent
        in: query
        name: iata
        type: string
      - description: Filter by region ID, expands to member IATAs
        in: query
        name: regionId
        type: integer
      - description: Filter by region slug, expands to member IATAs; combined with
          explicit IATAs
        in: query
        name: region
        type: string
      - description: Start of packet window epoch ms, rounded down to the hour (default
          7 days ago)
        in: query
        name: since
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ScopeStats'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: 'The read took too long: retry after Retry-After seconds'
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: Scope statistics
      tags:
      - Stats
  /stats/series:
    get:
      description: One entry per UTC hour in [since, until) plus a summary over the
        complete hours. Both bounds round down to UTC hours and since is clamped to
        the rollup retention; the response reports the effective window. An hour is
        rolled about 95 minutes after it closes, so recent hours are "missing" until
        then; "partial" hours lost raw rows before they could be rolled and never
        get values. Counts (observations, packets) sum across hours, with a packet
        counted once in each hour it was heard; observers, IATAs and scopes are distinct
        across the whole window; averages are sum / samples. revision changes whenever
        any rolled hour changes.
      parameters:
      - description: Inclusive start, epoch milliseconds
        in: query
        name: since
        required: true
        type: integer
      - description: Exclusive end, epoch milliseconds; the window is at most the
          rollup retention (default 90 days)
        in: query
        name: until
        required: true
        type: integer
      - description: Comma-separated reception IATA codes
        in: query
        name: iatas
        type: string
      - description: Region ID, expands to member IATAs
        in: query
        name: regionId
        type: integer
      - description: Region slug, expands to member IATAs
        in: query
        name: region
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.StatsSeries'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: Hourly network activity from the analytics rollups
      tags:
      - Stats
  /stats/signal:
    get:
      description: Aggregates stored observer receptions in [since, until), at most
        30 days. SNR is dB; RSSI is dBm. Null/non-finite readings and the zero/zero
        unavailable sentinel are excluded per metric; actual zero SNR with nonzero
        RSSI remains valid. Averages are null without samples. Histogram bounds are
        lower-inclusive/upper-exclusive, with null for unbounded ends. Both boundaries
        round down to UTC hours and the response reports that effective window. Reads
        the hourly signal rollup; an hour appears only after it is rolled, about 95
        minutes after it ends, and hours without data are omitted. These last-hop
        readings do not measure end-to-end quality or packet loss.
      parameters:
      - description: Inclusive start, epoch milliseconds (0 through 253402300799999)
        in: query
        name: since
        required: true
        type: integer
      - description: Exclusive end, epoch milliseconds; at most 30 days after since
        in: query
        name: until
        required: true
        type: integer
      - description: Comma-separated reception IATA codes
        in: query
        name: iatas
        type: string
      - description: Region ID, expands to member IATAs
        in: query
        name: regionId
        type: integer
      - description: Region slug, expands to member IATAs
        in: query
        name: region
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.SignalStats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: Reception signal distributions and hourly trends
      tags:
      - Stats
  /stats/top-advertisers:
    get:
      description: Ranks by the sort count, ties broken by total adverts then public
        key. Each advert counts once per hour heard, however many requested IATAs
        heard it. nodeId is null when the node row has been deleted.
      parameters:
      - description: Comma-separated IATA codes
        in: query
        name: iatas
        type: string
      - description: Filter by region ID, expands to member IATAs
        in: query
        name: regionId
        type: integer
      - description: Filter by region slug, expands to member IATAs
        in: query
        name: region
        type: string
      - description: Start of window epoch ms (default last 24h)
        in: query
        name: since
        type: integer
      - description: Max results (default 10); must be positive, values above 200
          are clamped
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - description: Rank by flood or direct advert count
        enum:
        - flood
        - direct
        in: query
        name: sort
        required: true
        type: string
      produces:
