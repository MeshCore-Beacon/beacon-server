      iata:
        type: string
      id:
        type: integer
      observerId:
        type: string
      observerName:
        type: string
      pathBytes:
        description: hex-encoded accumulated path hashes
        type: string
      pathLength:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PacketPathLength'
      propagationTimeMs:
        description: ms since first observation; 0 for first
        type: integer
      radio:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PacketRadio'
      resolvedDestination:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedHop'
      resolvedPath:
        description: per-observation resolved path hashes
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedHop'
        type: array
      resolvedSource:
        allOf:
        - $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedHop'
        description: |-
          ResolvedSource/ResolvedDestination are the packet's endpoints, when the payload type
          carries one. Prefer the snapshot captured at ingest; legacy observations without a
          snapshot use the current node registry. Endpoint matching itself is unchanged:
          an exact match for ADVERT's full pubkey, an ambiguous
          hash-prefix match (like intermediate hops) for TEXT_MESSAGE/PATH/ANON_REQ's 1-byte
          source/destination hashes. Nil when the payload type doesn't carry one at all (e.g.
          GRP_TXT/GRP_DATA/TRACE aren't node-to-node addressed) -- see BuildResolvedPath and
          ResolveExactNode for how each is built.
      rssi:
        type: integer
      snr:
        type: number
      sourceBroker:
        type: string
      wirePathBytes:
        description: |-
          WirePathBytes is the path field as it was on air (hex), sent only for a TRACE, whose pathBytes carry the
          payload's hop hashes instead: the per-hop SNR bytes, empty when no hop had been reached.
        type: string
