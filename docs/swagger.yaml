  /stats/observations:
    get:
      description: Observation counts only; distinct packet and observer counts don't
        sum across IATAs, so read them from /stats/series.
      parameters:
      - description: Comma-separated IATA codes
        in: query
        name: iatas
        type: string
      - description: Filter by region ID, expands to member IATAs
        in: query
        name: regionId
        type: integer
      - description: Filter by region slug, expands to member IATAs
        in: query
        name: region
        type: string
      - description: Start of window epoch ms (default 7 days ago)
        in: query
        name: since
        type: integer
      produces:
