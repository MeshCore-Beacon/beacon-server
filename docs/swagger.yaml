      rssiSamples:
        type: integer
      rssiSum:
        description: average = rssiSum / rssiSamples
        type: number
      scopedPackets:
        type: integer
      snrSamples:
        type: integer
      snrSum:
        description: average = snrSum / snrSamples
        type: number
      uniquePackets:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.StatusResponse:
    properties:
      status:
        example: check_email
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.TelemetryRequest:
    properties:
      createdAt:
        example: 1794700000000
        type: integer
      hasPassword:
        type: boolean
      id:
        type: string
      latestReadingAt:
        description: LatestReadingAt is epoch ms of the newest trusted reading, null
          when none.
        example: 1794703600000
        type: integer
      node:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.TelemetryRequestNode'
      poller:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.TelemetryRequestPoller'
      status:
        enum:
        - waiting
        - active
        - login_failed
        - admin_stopped
        - disabled
        type: string
      statusReason:
        example: No observer can reach this repeater yet.
        type: string
      statusReasonCode:
        description: |-
          StatusReasonCode is a stable code for the reason: no_observer, no_seat, login_failed, blank_login_failed,
          admin_stopped, blank_blocked, offline, observer or other; empty when there is no reason.
        example: no_observer
        type: string
      statusReasonDays:
        description: StatusReasonDays is the number of days of the offline reason;
          omitted for any other.
        example: 7
        type: integer
      updatedAt:
        example: 1794700000000
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.TelemetryRequestList:
    properties:
      limit:
        description: Limit is how many requests one user may hold.
        example: 3
        type: integer
      requests:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.TelemetryRequest'
        type: array
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.TelemetryRequestNode:
    properties:
      id:
        example: 3f2b8c1e-6a52-4d0e-9b57-0d3d2b6a1c11
        type: string
      name:
        example: Hilltop
        type: string
      publicKey:
        example: 0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.TelemetryRequestPoller:
    properties:
      name:
        example: North Ridge
        type: string
      observerId:
        type: string
      state:
        description: |-
          State is what the poller's latest live claim says about this repeater: pending, ok, no_reply, login_failed,
          admin_stop or not_direct, any other value the firmware sends (lower case, at most 32 characters), or
          not_claimed when the claim does not list the repeater or the observer has no live claim.
        example: not_direct
        type: string
      stateAt:
        description: StateAt is epoch ms when that claim was received, null when the
          observer has no live claim.
        example: 1794703600000
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.TokenRequest:
    properties:
      token:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.TopAdvertiser:
    properties:
      advertCount:
        type: integer
      directAdvertCount:
        type: integer
      floodAdvertCount:
        description: |-
          FloodAdvertCount/DirectAdvertCount split AdvertCount by how the advert was routed:
          flood = route type 0 (transport_flood) or 1 (flood), broadcast with no known path;
          direct = route type 2 (direct) or 3 (transport_direct), routed along a known path.
          FloodAdvertCount + DirectAdvertCount == AdvertCount.
        type: integer
      iata:
        type: string
      lastHeard:
        description: epoch ms
        type: integer
      nodeId:
        description: null once the node row has been deleted
        type: string
      nodeName:
        type: string
      nodeType:
        type: integer
      nodeTypeName:
        type: string
      publicKey:
        description: hex
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.TopNode:
    properties:
      iata:
        type: string
      lastHeard:
        description: epoch ms
        type: integer
      nodeId:
        description: null once the node row has been deleted
        type: string
      nodeName:
        type: string
      nodeType:
        type: integer
      nodeTypeName:
        type: string
      observationCount:
        type: integer
      publicKey:
        description: hex
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.TopObserver:
    properties:
      displayName:
        type: string
      iata:
        type: string
      observationCount:
        type: integer
      observerId:
        type: string
      observerType:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.TopTalker:
    properties:
      lastSent:
        description: epoch ms
        type: integer
      messageCount:
        type: integer
      senderName:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.TraceDetail:
    properties:
      packets:
        description: all packets observed for this trace
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.TracePacket'
        type: array
      traceTag:
        description: hex-encoded 4-byte tag
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.TracePacket:
    properties:
      firstHeardAt:
        description: epoch ms
        type: integer
      lastHeardAt:
        description: epoch ms
        type: integer
      packetHash:
        description: hex-encoded packet hash
        type: string
      rawPath:
        description: hops as received in the packet
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.RawHop'
        type: array
      resolvedRoute:
        description: hops resolved to known nodes
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedHop'
        type: array
      routeType:
        description: numeric route type
        type: integer
      routeTypeName:
        description: human-readable route type
        type: string
      scope:
        description: transport scope name, if known
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.TraceTagSummary:
    properties:
      firstHeardAt:
        description: epoch ms
        type: integer
      iataCount:
        description: number of distinct IATAs where heard
        type: integer
      lastHeardAt:
        description: epoch ms
        type: integer
      packetCount:
        description: number of packets with this trace tag
        type: integer
      pathHashes:
        description: hops from the most complete observation
        items:
          type: string
        type: array
      snrValues:
        description: SNR per hop from the most complete observation
        items:
          type: number
        type: array
      traceTag:
        description: hex-encoded 4-byte tag
        type: string
      traceType:
        description: TRACE or PING
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.UpdateAdminCORSRequest:
    properties:
      allowed_origins:
        items:
          type: string
        type: array
    required:
    - allowed_origins
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.UpdateAdminConfigRequest:
    properties:
      cors:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.UpdateAdminCORSRequest'
      guards:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.UpdateAdminGuardsRequest'
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.UpdateAdminConfigResponse:
    properties:
      config:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AdminConfig'
      persisted:
        type: boolean
      requires_restart:
        type: boolean
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.UpdateAdminGuardsRequest:
    properties:
      enforce:
        items:
          type: string
        type: array
    required:
    - enforce
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.UpdateMeRequest:
    properties:
      displayName:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.UpdateTelemetryRequest:
    properties:
      enabled:
        type: boolean
      password:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.User:
    properties:
      createdAt:
        description: CreatedAt is epoch milliseconds.
        example: 1794700000000
        type: integer
      displayName:
        example: Ridge Walker
        type: string
      email:
        example: a@example.org
        type: string
      emailVerified:
        example: true
        type: boolean
      id:
        example: 3f2b8c1e-6a52-4d0e-9b57-0d3d2b6a1c11
        type: string
      pendingEmail:
        example: new@example.org
        type: string
      provider:
        example: local
        type: string
      username:
        example: ridgewalker
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.UserResponse:
    properties:
      user:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.User'
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.UserSession:
    properties:
      createdAt:
        type: integer
      current:
        type: boolean
      expiresAt:
        type: integer
      id:
        type: string
      kind:
        enum:
        - web
        - app
        type: string
      label:
        example: Firefox on macOS
        type: string
      lastUsedAt:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.WSTicket:
    properties:
      expiresAt:
        description: ExpiresAt is when the ticket stops opening /ws, in epoch ms.
        example: 1793470167000
        type: integer
      ticket:
        example: AAABmZ1s4CgLBvU1n1yN3v8hQm9YtVq2
        type: string
    type: object
  internal_api_handlers.APIError:
    properties:
      code:
        description: e.g. "not_found", "bad_request"
        type: string
      message:
        description: e.g. "channel not found"
        type: string
      reasonCode:
        description: |-
          ReasonCode is a stable snake_case code for the reason behind the message, when the error has one
          (422 kind_unavailable); omitted otherwise.
        type: string
    type: object
  internal_api_handlers.BrokerStatus:
    properties:
      connected:
        type: boolean
      name:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: MeshCore Beacon
    url: https://github.com/MeshCore-Beacon/beacon-server
  description: |-
    MeshCore network observation backend. Ingests LoRa packets from MQTT brokers, stores in PostgreSQL, and streams live events via WebSocket.
    REST requests share a configurable per-client rate limit (default 600/minute and a 600-request one-second burst cap). Exceeded limits return HTTP 429 with error.code=rate_limited and a Retry-After header in seconds. CORS preflights and WebSocket upgrades do not consume this API budget.
    WebSocket upgrade attempts at /ws have a configurable per-client limit (default 10/minute, including failed handshakes). Rate exhaustion returns HTTP 429 with Retry-After before upgrade. An accepted socket exceeding the concurrent cap closes with code 1013 before hello; established connections remain open.
    Database cost guards: a guarded family returns 429 (rate_limited, Retry-After 1) above 4 concurrent database requests per client, or 503 with Retry-After (deadline_exceeded, 5 s; service_unavailable, 2 s). Families observe by default and refuse nothing until an operator enforces them.
  license:
    name: AGPL-3-or-later
  termsOfService: https://github.com/MeshCore-Beacon/beacon-server
  title: MeshCore Beacon API
  version: 2.3.0
paths:
  /admin/accounts:
    get:
      description: Includes active and inactive accounts, newest first. These records
        are not login users.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AccountList'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
      security:
      - AdminKey: []
      summary: List operator accounts
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Trims the name; names are case-sensitive and unique among active
        accounts. No credential or login is created.
      parameters:
      - description: Account name (1-128 Unicode characters, no control characters);
          body at most 4 KiB
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.Account'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "415":
          description: Unsupported Media Type
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
      security:
      - AdminKey: []
      summary: Create an operator account
      tags:
      - Admin
  /admin/accounts/{id}:
    delete:
      description: Soft deactivation preserves the record. Its name may be reused
        by a new account.
      parameters:
      - description: Account UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Deactivated
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
      security:
      - AdminKey: []
      summary: Deactivate an operator account
      tags:
      - Admin
    get:
      description: Returns active or inactive account records.
      parameters:
      - description: Account UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.Account'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
      security:
      - AdminKey: []
      summary: Get an operator account
      tags:
      - Admin
  /admin/backup:
    get:
      description: Opt-in operator export. Returns only a completed bundle; one export/transfer
        at a time. Contains secrets. Login sessions, external deployment files and
        import are outside this endpoint.
      produces:
      - application/gzip
      responses:
        "200":
          description: OK
          headers:
            Content-Disposition:
              description: attachment; filename=beacon-backup.tar.gz
              type: string
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "504":
          description: Gateway Timeout
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "507":
          description: Insufficient Storage
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
      security:
      - AdminKey: []
      summary: Download a private database and saved-config backup
      tags:
      - Admin
  /admin/config:
    get:
      description: Returns current CORS options, auth configuration status, configured
        broker count and, when database guards are configured, their state. Credential
        fields and other configuration are excluded. Runtime origin updates are lost
        on restart. PUT also replaces guards.enforce at runtime; the configuration
        file is the boot default.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AdminConfig'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
      security:
      - AdminKey: []
      summary: Inspect selected running configuration
      tags:
      - Admin
    put:
      consumes:
      - application/json
      description: Replaces cors.allowed_origins, guards.enforce or both immediately;
        at least one is required. Both are validated before either is applied. An
        empty guards.enforce list makes every family observe. Updates are serialized;
        concurrent valid updates are applied one at a time. Already-running requests
        may finish with the previous policy. Nothing is persisted; restart reloads
        saved configuration.
      parameters:
      - description: 'cors.allowed_origins: 1-32 ASCII HTTP(S) origins, at most 512
          bytes each; one hostname wildcard is supported, or a sole *. Empty/null
          lists and unsupported fields are rejected. guards.enforce: guard family
          names, possibly empty. Body at most 16 KiB.'
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.UpdateAdminConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.UpdateAdminConfigResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "415":
          description: Unsupported Media Type
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
      security:
      - AdminKey: []
      summary: Update runtime CORS origins and enforced guard families
      tags:
      - Admin
  /admin/db/planguard:
    get:
      description: Plans every corpus statement in custom and generic mode against
        this database, read-only and without executing it (plain EXPLAIN, 5 s per
        plan, 1 s lock timeout), and checks each plan against the corpus. Off unless
        planguard.daily_check is set (404 "planguard daily check is disabled"); when
        on, the check runs about an hour after boot and then daily, and until its
        first run this returns 404. fresh=true runs it now, shared with any run in
        progress and cancelled at server shutdown; within 5 minutes of the last run's
        end it starts nothing and returns the last successful report (started_at gives
        its age), or 500 when no run has succeeded yet. A read-only server cannot
        enable the check (configuration refuses planguard.daily_check with server.read_only),
        so there this returns 404 "planguard daily check is disabled".
      parameters:
      - description: Run the check now instead of returning the last report
        in: query
        name: fresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.PlanguardReport'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
      security:
      - AdminKey: []
      summary: Last daily plan regression check
      tags:
      - Admin
  /admin/db/statements:
    get:
      description: Sums pg_stat_statements for this database by sqlc statement name,
        highest total execution time first. Statements without a name are summed as
        "(unnamed)". Times are milliseconds rounded to microseconds; plan_ms stays
        0 unless pg_stat_statements.track_planning is on. Counters run from the last
        pg_stat_statements reset.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.DBStatementsResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              $ref: '#/definitions/internal_api_handlers.APIError'
            type: object
        "503":
          description: Service Unavailable
