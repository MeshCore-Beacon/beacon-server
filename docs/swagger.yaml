              $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.Region'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: 'The read took too long: retry after Retry-After seconds'
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: List all regions
      tags:
      - Regions
  /regions/{regionId}:
    get:
      parameters:
      - description: Region ID
        in: path
        name: regionId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.Region'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: 'The read took too long: retry after Retry-After seconds'
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: Get a single region
      tags:
      - Regions
  /routes:
    get:
      description: |-
        Newest first. iatas filters by several IATA codes and takes precedence over the single iata, which
        is matched exactly as given. With neither, every IATA's routes are listed.
      parameters:
      - description: Comma-separated IATA codes (max 100)
        in: query
        name: iatas
        type: string
      - description: Single IATA code (when iatas is omitted)
        in: query
        name: iata
        type: string
      - description: Filter by exact hop count
        in: query
        name: hopCount
        type: integer
      - description: Epoch ms timestamp of last item for pagination
        in: query
        name: cursor
        type: integer
      - description: id of the last item; with cursor, also returns later routes sharing
          that millisecond
        in: query
        name: cursorId
        type: integer
      - description: Max results (default 50); must be positive, values above 200
          are clamped
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.KnownRoute'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: 'The read took too long: retry after Retry-After seconds'
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: List known routes
      tags:
      - Routes
  /routes/{iata}/{pathKey}/observations:
    get:
      description: Matches the saved IATA, complete path bytes and hash width. Excludes
        TRACE and unclassified reports; other widths and search-result subsegments
        are not included. Byte matches do not prove hop identities or delivery. The
        route and its historical counter can outlive raw evidence. Cursors retain
        full timestamp precision and pin the route, the window and the path representation
        the first page matched.
      parameters:
      - description: Three-character IATA code
        in: path
        name: iata
        required: true
        type: string
      - description: Stable 32-hex pathKey from a known-route response
        in: path
        name: pathKey
        required: true
        type: string
      - description: Server-anchored duration (default 24h, max 720h); exclusive with
          since/until/pageCursor
        in: query
        name: range
        type: string
      - description: Window start epoch ms; provide with until (default last 24h)
        in: query
        name: since
        type: integer
      - description: Exclusive window end epoch ms; maximum span 30d, end may be up
          to 5 minutes ahead of server time (clock skew tolerance)
        in: query
        name: until
        type: integer
      - description: Opaque precise cursor from nextPageCursor; route, window and
          path are pinned
        in: query
        name: pageCursor
        type: string
      - description: Default 50; positive, capped at 200
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.RouteEvidence'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: 'The lookup took too long: retry after Retry-After seconds'
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: Get retained reports matching a full saved route prefix sequence
      tags:
      - Routes
  /routes/cross:
    get:
      description: |-
        Pass iatas (comma-separated, optional; omitted searches every IATA) or the
        single directed pair fromIata/toIata, not both.
      parameters:
      - description: Source node hash prefix (hex, 1-4 bytes)
        in: query
        name: fromHash
        required: true
        type: string
      - description: Destination node hash prefix (hex, 1-4 bytes)
        in: query
        name: toHash
        required: true
        type: string
      - description: Comma-separated IATA codes to search (2-100)
        in: query
        name: iatas
        type: string
      - description: Source IATA code (with toIata)
        in: query
        name: fromIata
        type: string
      - description: Destination IATA code (with fromIata)
        in: query
        name: toIata
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.CrossIATARoute'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: Search for routes that cross IATA boundaries
      tags:
      - Routes
  /routes/search:
    get:
      description: |-
        Routes within one IATA that run from the source hash to the destination hash,
        trimmed to that span. iatas is optional (omitted searches every IATA); the single
        iata is still accepted. At most 500, shortest first.
      parameters:
      - description: Comma-separated IATA codes to search (max 100)
        in: query
        name: iatas
        type: string
      - description: Single IATA code (when iatas is omitted)
        in: query
        name: iata
        type: string
      - description: Source node hash prefix (hex, 1-4 bytes)
        in: query
        name: from
        required: true
        type: string
      - description: Destination node hash prefix (hex, 1-4 bytes)
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.KnownRoute'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: Search known routes by source and destination hash
      tags:
      - Routes
  /scopes:
    get:
      description: Without filters, lists every stored scope name, including imported
        names retained after an importer is disabled or a source is removed. With
        IATA or region filters, lists only manual scopes configured for a matching
        region and imported scopes whose current MeshMapper catalogue includes a matching
        IATA; observed traffic does not add scopes.
      parameters:
      - description: Filter by IATA code(s), comma-separated
        in: query
        name: iatas
        type: string
      - description: Filter by region slug
        in: query
        name: region
        type: string
      - description: Filter by region ID
        in: query
        name: regionId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: 'The read took too long: retry after Retry-After seconds'
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: List transport scopes
      tags:
      - Scopes
  /scopes/{name}:
    get:
      description: packetCount sums packets per hour across every retained rollup
        hour; iatas are the IATAs that heard the scope's packets. Observer and node
        counts are current memberships.
      parameters:
      - description: 'Scope name e.g. %23bc (URL-encoded #bc)'
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ScopeDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: 'The read took too long: retry after Retry-After seconds'
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: Get scope detail by name
      tags:
      - Scopes
  /stats/clock-drift:
