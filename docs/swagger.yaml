basePath: /api/v1
definitions:
  github_com_MeshCore-Beacon_beacon-server_internal_api.Account:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      deactivated_at:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AccountList:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.Account'
        type: array
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AdminAuthConfig:
    properties:
      configured:
        type: boolean
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AdminCORSConfig:
    properties:
      allow_credentials:
        type: boolean
      allowed_headers:
        items:
          type: string
        type: array
      allowed_methods:
        items:
          type: string
        type: array
      allowed_origins:
        items:
          type: string
        type: array
      max_age:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AdminConfig:
    properties:
      auth:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AdminAuthConfig'
      cors:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AdminCORSConfig'
      guards:
        allOf:
        - $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AdminGuardsConfig'
        description: absent when database guards are not configured
      ingest:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AdminIngestConfig'
      mobile:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AdminMobileConfig'
      web:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AdminWebConfig'
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AdminGuardsConfig:
    properties:
      api_plan_layout:
        description: custom_all, split or single
        type: string
      budget:
        description: always "shadow"
        type: string
      enforce:
        description: families currently enforced; the configuration file is the boot
          default
        items:
          type: string
        type: array
      observe_only:
        description: the single plan layout makes every family observe
        type: boolean
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AdminIngestConfig:
    properties:
      broker_count:
        description: |-
          BrokerCount counts configured broker workers, not active MQTT connections
          or a configurable processing-worker pool.
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AdminMobileConfig:
    properties:
      min_app_version:
        description: effective floor; empty means no requirement
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AdminUser:
    properties:
      createdAt:
        description: CreatedAt is epoch milliseconds.
        example: 1794700000000
        type: integer
      disabled:
        description: Disabled users cannot sign in and have no live sessions.
        example: false
        type: boolean
      displayName:
        example: Ridge Walker
        type: string
      email:
        example: a@example.org
        type: string
      emailVerified:
        example: true
        type: boolean
      id:
        example: 3f2b8c1e-6a52-4d0e-9b57-0d3d2b6a1c11
        type: string
      lastLoginAt:
        example: 1794703600000
        type: integer
      pendingEmail:
        example: new@example.org
        type: string
      provider:
        example: local
        type: string
      username:
        example: ridgewalker
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AdminUserList:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AdminUser'
        type: array
      nextCursor:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AdminUserResponse:
    properties:
      user:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AdminUser'
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AdminWebConfig:
    properties:
      min_web_version:
        description: effective floor; empty means no requirement
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AdvertObservation:
    properties:
      heardAt:
        description: epoch ms
        type: integer
      hopCount:
        type: integer
      iata:
        type: string
      id:
        description: observation ID, use as cursor for pagination
        type: integer
      nodeName:
        type: string
      nodePublicKey:
        description: hex-encoded
        type: string
      packetHash:
        description: hex-encoded
        type: string
      payloadType:
        type: integer
      payloadTypeName:
        type: string
      rssi:
        type: integer
      snr:
        type: number
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AlertChannels:
    properties:
      email:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AlertEmailChannel'
      push:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AlertPushChannel'
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AlertEmailChannel:
    properties:
      available:
        type: boolean
      enabled:
        type: boolean
      reason:
        enum:
        - ""
        - server_off
        - portal_account
        - unverified_email
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AlertPushChannel:
    properties:
      available:
        type: boolean
      enabled:
        type: boolean
      hasDevice:
        type: boolean
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AlertRule:
    properties:
      enabled:
        type: boolean
      id:
        type: string
      kind:
        enum:
        - gone_quiet
        - back_online
        - clock
        - battery_low
        - battery_falling
        - rebooted
        - temperature
        - noise_high
        - observer_offline
        type: string
      lastSentAt:
        example: 1794703600000
        type: integer
      state:
        enum:
        - ok
        - firing
        - inactive
        - unknown
        type: string
      stateChangedAt:
        example: 1794700000000
        type: integer
      threshold:
        example: 3500
        type: integer
      thresholdHigh:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AlertTarget:
    properties:
      available:
        items:
          type: string
        type: array
      id:
        description: ID is the node's or observer's id as used by /nodes/{id} and
          /observers/{id}; null when the radio no longer exists.
        format: uuid
        type: string
      kind:
        enum:
        - node
        - observer
        type: string
      name:
        example: Hilltop
        type: string
      polled:
        description: |-
          Polled: the radio has a current source: a repeater is assigned to an observer that polls it, an observer has sent
          status telemetry in the last day. Old readings alone do not count. It is what offers the telemetry kinds and the 3 and 6 hour
          gone_quiet thresholds for a repeater (observers always have those).
        type: boolean
      publicKey:
        type: string
      rules:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AlertRule'
        type: array
      unavailable:
        additionalProperties:
          type: string
        description: Unavailable maps a kind to the English reason this radio cannot
          have it.
        type: object
      unavailableCodes:
        additionalProperties:
          type: string
        description: |-
          UnavailableCodes maps the same kinds to a stable code for the reason: observer_no_data, repeaters_only, not_polled,
          no_data, observer_no_clock, clock_repeaters_only.
        type: object
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AlertTargetRef:
    properties:
      kind:
        enum:
        - node
        - observer
        type: string
      publicKey:
        example: 0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AlertsResponse:
    properties:
      channels:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AlertChannels'
      targets:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AlertTarget'
        type: array
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AppCodeRequest:
    properties:
      codeChallenge:
        description: CodeChallenge is the base64url SHA-256 of the code verifier (S256
          only).
        type: string
      deviceLabel:
        type: string
      state:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AppCodeResponse:
    properties:
      code:
        type: string
      redirectUri:
        example: meshcorebeacon://auth
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AppTokenRequest:
    properties:
      code:
        type: string
      codeVerifier:
        type: string
      deviceLabel:
        description: |-
          DeviceLabel names the app's device, e.g. "Beacon app on iPhone". Optional: when empty the session keeps the
          label of the browser that issued the code.
        example: Beacon app on iPhone
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AppTokenResponse:
    properties:
      expiresAt:
        type: integer
      token:
        type: string
      user:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.User'
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.Atlas:
    properties:
      limit:
        example: 20
        type: integer
      pins:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AtlasPin'
        type: array
      range:
        enum:
        - 24h
        - 3d
        type: string
      revision:
        example: 7
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AtlasConflict:
    properties:
      current:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.Atlas'
      error:
        $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.AtlasConflictError'
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AtlasConflictError:
    properties:
      code:
        example: atlas_conflict
        type: string
      message:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AtlasPin:
    properties:
      id:
        type: string
        x-nullable: true
      kind:
        enum:
        - node
        - observer
        type: string
      name:
        type: string
      observerId:
        type: string
        x-nullable: true
      observerPublicKey:
        type: string
      publicKey:
        example: 0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a0f3a
        type: string
      telemetryTiles:
        description: TelemetryTiles are the four tiles of a node pin's Telemetry view;
          absent means the client's default.
        items:
          enum:
          - battery
          - noise
          - uptime
          - airtime
          - temperature
          - packets
          - signal
          - errors
          type: string
        type: array
      tiles:
        items:
          type: string
        type: array
      view:
        enum:
        - heard
        - observer
        - telemetry
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.AtlasPinInput:
    properties:
      kind:
        enum:
        - node
        - observer
        type: string
      name:
        type: string
      observerId:
        type: string
      observerPublicKey:
        type: string
      publicKey:
        type: string
      telemetryTiles:
        description: |-
          TelemetryTiles is four distinct ids from battery, noise, uptime, airtime, temperature, packets, signal, errors.
          Node pins only.
        items:
          type: string
        type: array
      tiles:
        items:
          type: string
        type: array
      view:
        enum:
        - heard
        - observer
        - telemetry
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ChangeEmailRequest:
    properties:
      currentPassword:
        type: string
      email:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ChangePasswordRequest:
    properties:
      currentPassword:
        type: string
      newPassword:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.Channel:
    properties:
      channelHash:
        description: hex-encoded single-byte hash
        type: string
      hashtag:
        description: 'tag name without # prefix; non-nil only for hashtag channels'
        type: string
      id:
        type: integer
      isHashtag:
        description: true if key was derived from a hashtag PSK
        type: boolean
      keyFingerprint:
        description: first 8 bytes of SHA256(key), hex-encoded
        type: string
      keyKnown:
        description: true if Beacon has a decryption key for this channel
        type: boolean
      lastSeen:
        description: epoch ms, time of most recent message
        type: integer
      messageCount:
        description: lifetime count; not reduced by retention
        type: integer
      name:
        description: display name from config or nil
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ChannelMessage:
    properties:
      channelHash:
        description: hex-encoded single-byte channel hash
        type: string
      content:
        description: decrypted message text
        type: string
      id:
        type: integer
      observationCount:
        description: number of packet_observations rows for this message's packet
          hash
        type: integer
      packetHash:
        description: hex-encoded packet hash for correlation with packet events
        type: string
      scope:
        description: matched scope on the first stored packet; null when none was
          recorded
        type: string
      scopeStatus:
        enum:
        - matched
        - unscoped
        - unknown
        - unavailable
        type: string
      senderName:
        description: display name from the decrypted payload
        type: string
      sentAt:
        description: epoch ms, from the sender's embedded timestamp
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ChannelPage:
    properties:
      hasMore:
        type: boolean
      items:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ChannelSummary'
        type: array
      nextCursor:
        type: integer
      nextPageCursor:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ChannelSummary:
    properties:
      channelHash:
        description: hex-encoded single-byte hash
        type: string
      id:
        type: integer
      isHashtag:
        description: true if key was derived from a hashtag PSK
        type: boolean
      keyKnown:
        description: true if Beacon has a decryption key for this channel
        type: boolean
      lastSeen:
        description: epoch ms, time of most recent message
        type: integer
      name:
        description: display name from config or nil
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.ClockDriftEntry:
    properties:
      clockCheckedAt:
        description: epoch ms
        type: integer
      clockDriftSeconds:
        description: signed; +ve = device ahead of server
        type: integer
      iatas:
        description: IATAs this node has been heard in
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.NodeIATA'
        type: array
      nodeId:
        type: string
      nodeName:
        type: string
      nodeType:
        type: integer
      nodeTypeName:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.CreateAccountRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.CreateTelemetryRequest:
    properties:
      nodeId:
        example: 3f2b8c1e-6a52-4d0e-9b57-0d3d2b6a1c11
        type: string
      password:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.CrossIATAHop:
    properties:
      fromIata:
        type: string
      fromNode:
        allOf:
        - $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedNode'
        description: last node in source IATA
      lastSeen:
        description: epoch ms
        type: integer
      toIata:
        type: string
      toNode:
        allOf:
        - $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.ResolvedNode'
        description: first node in target IATA
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.CrossIATARoute:
    properties:
      crossHop:
        allOf:
        - $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.CrossIATAHop'
        description: the boundary hop
      sourceSegment:
        description: route segment in source IATA
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.RouteHop'
        type: array
      targetSegment:
        description: route segment in target IATA
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.RouteHop'
        type: array
      totalHops:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.DBStatement:
    properties:
      calls:
        type: integer
      exec_ms:
        type: number
      name:
        description: sqlc statement name; "(unnamed)" aggregates the rest
        type: string
      plan_ms:
        description: 0 unless pg_stat_statements.track_planning is on
        type: number
      rows:
        type: integer
      shared_hit:
        type: integer
      shared_read:
        type: integer
      wal_bytes:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.DBStatementsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.DBStatement'
        type: array
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.DeleteMeRequest:
    properties:
      confirmUsername:
        type: string
      currentPassword:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.EmailRequest:
    properties:
      email:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.IATA:
    properties:
      displayName:
        type: string
      iata:
        type: string
      lat:
        type: number
      lon:
        type: number
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.Info:
    properties:
      display:
        allOf:
        - $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.InfoDisplay'
        description: Display holds the instance-wide units clients show.
      features:
        allOf:
        - $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.InfoFeatures'
        description: Features tells clients which optional parts of the API this server
          offers.
      limits:
        allOf:
        - $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.InfoLimits'
        description: Limits are the instance caps clients enforce before asking.
      minAppVersion:
        description: MinAppVersion is the oldest allowed app version (X.Y.Z); null
          means no requirement.
        example: 0.1.1
        type: string
      minWebVersion:
        description: MinWebVersion is the oldest allowed Beacon Web version (X.Y.Z);
          null means no requirement.
        example: 2.0.3
        type: string
      serverVersion:
        example: 2.0.2
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.InfoAlertChannels:
    properties:
      email:
        example: false
        type: boolean
      push:
        example: false
        type: boolean
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.InfoDisplay:
    properties:
      distanceUnit:
        enum:
        - metric
        - imperial
        example: metric
        type: string
      temperatureUnit:
        enum:
        - c
        - f
        example: c
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.InfoFeatures:
    properties:
      accounts:
        example: "off"
        type: string
      alertChannels:
        allOf:
        - $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.InfoAlertChannels'
        description: AlertChannels says which channels the server sends alerts by.
      alerts:
        description: Alerts is true when the server sends alerts by at least one channel.
        example: false
        type: boolean
      appDeviceLabel:
        description: AppDeviceLabel is true when POST /auth/app/token takes a deviceLabel.
          Always true on this version.
        example: true
        type: boolean
      atlasTelemetry:
        description: |-
          AtlasTelemetry is true when the server accepts the telemetry view and telemetryTiles on Atlas pins and the 72h
          node telemetry range. Always true on this version.
        example: true
        type: boolean
      mapTelemetry:
        description: MapTelemetry is true when the server returns recent telemetry
          readings for map labels. Always true on this version.
        example: true
        type: boolean
      polling:
        example: true
        type: boolean
      portalUrl:
        description: PortalURL is the sign-in portal's base URL; set only when accounts
          is "portal".
        example: https://portal.example.org
        type: string
      push:
        allOf:
        - $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.InfoPush'
        description: |-
          Push names the push server the app gets a device handle from, and this server's Push ID there; set only while
          alertChannels.push is true.
      registration:
        description: Registration is true when new sign-ups are open; only meaningful
          when accounts is "local".
        example: false
        type: boolean
      telemetryRequests:
        example: false
        type: boolean
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.InfoLimits:
    properties:
      atlas:
        description: Atlas is the most cards one Atlas holds, in the browser or synced
          to an account.
        example: 20
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.InfoPush:
    properties:
      pushId:
        example: inst_7f3k2m9qxa
        type: string
      server:
        example: https://push.meshcorebeacon.ca
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.KnownRoute:
    properties:
      firstSeen:
        description: epoch ms
        type: integer
      hopCount:
        type: integer
      hops:
        items:
          $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.RouteHop'
        type: array
      iata:
        type: string
      id:
        type: integer
      lastSeen:
        description: epoch ms
        type: integer
      observationCount:
        type: integer
      pathKey:
        description: stable identity within this IATA; use for route evidence links
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.LoginRequest:
    properties:
      login:
        description: Login is a username or an email address.
        type: string
      password:
        type: string
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.MeshMapperDefaultScope:
    properties:
      name:
        type: string
      source:
        description: advert or reported
        type: string
      state:
        description: named, unknown (set but not nameable yet) or none
        type: string
      updatedAt:
        type: integer
    type: object
  github_com_MeshCore-Beacon_beacon-server_internal_api.MeshMapperRepeater:
    properties:
