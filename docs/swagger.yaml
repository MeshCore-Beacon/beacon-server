              $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.TraceTagSummary'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: 'The read took too long: retry after Retry-After seconds'
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: List trace tags
      tags:
      - Traces
  /traces/{tag}:
    get:
      parameters:
      - description: Trace tag hex e.g. a3f1b2c4
        in: path
        name: tag
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.TraceDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
        "503":
          description: 'The read took too long: retry after Retry-After seconds'
          schema:
            $ref: '#/definitions/internal_api_handlers.APIError'
      summary: Get full trace detail by tag
      tags:
      - Traces
  /ws-ticket:
    get:
      description: |-
        For clients that send no Origin header, such as BEACON Mobile. Send the ticket in the
        X-Beacon-Ticket header of the /ws upgrade. It works for 60 seconds, from the same client
        address (IPv6: the same /64), and only on this server process. Required only when
        websocket.require_origin is on; browsers never need one.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MeshCore-Beacon_beacon-server_internal_api.WSTicket'
      summary: Ticket for opening /ws without an Origin
      tags:
      - Info
schemes:
- http
- https
securityDefinitions:
  AdminKey:
    description: Enter Bearer followed by the configured operator key. Use HTTPS.
    in: header
    name: Authorization
    type: apiKey
  UserSession:
    description: Enter Bearer followed by an app session token from POST /auth/app/token.
      Web sessions use the beacon_session cookie and the X-Beacon-CSRF header instead.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Sign-in, sessions and the signed-in user's profile; 404 accounts_disabled
    unless accounts.mode is local
  name: Accounts
- description: Airport/location codes that group observers and packets
  name: IATAs
- description: Super-regions grouping multiple IATAs
  name: Regions
- description: MeshCore MQTT observers (gateways)
  name: Observers
- description: MeshCore radio nodes
  name: Nodes
- description: LoRa packets heard by observers
  name: Packets
- description: MeshCore group text channels
  name: Channels
- description: Decrypted channel messages
  name: Messages
- description: MQTT broker connection status
  name: Brokers
- description: Network statistics and time series
  name: Stats
- description: Server info for the BEACON Mobile app
  name: Info
