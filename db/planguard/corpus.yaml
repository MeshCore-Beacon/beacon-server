  # Observer comparison roles, picked among the observers in the newest 200,000 observation ids (a pkey range): the
  # two busiest, the busiest one's latest site, and the two that heard least (but something) in the 7 d window, each
  # counted on idx_observations_observer up to 1,000. cmp_unknown is a fixed non-zero id that matches no observer.
  # Windows end at the newest reception (a max on idx_observations_heard).
  cmp_busy1: "SELECT observer_id FROM packet_observations WHERE id > (SELECT max(id) FROM packet_observations) - 200000 GROUP BY 1 ORDER BY count(*) DESC, observer_id LIMIT 1"
  cmp_busy2: "SELECT observer_id FROM packet_observations WHERE id > (SELECT max(id) FROM packet_observations) - 200000 GROUP BY 1 ORDER BY count(*) DESC, observer_id OFFSET 1 LIMIT 1"
  cmp_quiet1_7d: "WITH t AS (SELECT max(heard_at) hi FROM packet_observations), c AS (SELECT DISTINCT observer_id FROM packet_observations WHERE id > (SELECT max(id) FROM packet_observations) - 200000) SELECT c.observer_id FROM c CROSS JOIN t CROSS JOIN LATERAL (SELECT count(*) n FROM (SELECT 1 FROM packet_observations x WHERE x.observer_id = c.observer_id AND x.heard_at >= t.hi - interval '7 days' AND x.heard_at < t.hi LIMIT 1000) s) k WHERE k.n > 0 ORDER BY k.n, c.observer_id LIMIT 1"
  cmp_quiet2_7d: "WITH t AS (SELECT max(heard_at) hi FROM packet_observations), c AS (SELECT DISTINCT observer_id FROM packet_observations WHERE id > (SELECT max(id) FROM packet_observations) - 200000) SELECT c.observer_id FROM c CROSS JOIN t CROSS JOIN LATERAL (SELECT count(*) n FROM (SELECT 1 FROM packet_observations x WHERE x.observer_id = c.observer_id AND x.heard_at >= t.hi - interval '7 days' AND x.heard_at < t.hi LIMIT 1000) s) k WHERE k.n > 0 ORDER BY k.n, c.observer_id OFFSET 1 LIMIT 1"
  cmp_busy1_site: "SELECT iata FROM packet_observations WHERE id > (SELECT max(id) FROM packet_observations) - 200000 AND observer_id = (SELECT observer_id FROM packet_observations WHERE id > (SELECT max(id) FROM packet_observations) - 200000 GROUP BY 1 ORDER BY count(*) DESC, observer_id LIMIT 1) ORDER BY id DESC LIMIT 1"
  cmp_unknown: "SELECT md5('observer comparison: no such observer')::uuid WHERE NOT EXISTS (SELECT 1 FROM observers WHERE id = md5('observer comparison: no such observer')::uuid)"
  cmp_until: "SELECT max(heard_at) FROM packet_observations"
  cmp_since_1d: "SELECT max(heard_at) - interval '1 day' FROM packet_observations"
  cmp_since_7d: "SELECT max(heard_at) - interval '7 days' FROM packet_observations"
  # The adverts and telemetry roles are picked among the newest 5,000,000 observation ids (200,000 telemetry ids, about
  # 10K rows), a pkey range: advert counts are aggregate filters, never a WHERE on payload_type, so the partial adverts
  # index cannot replace the window. They stay far below the prod tier's 20 s cap; adv_zero and adv_quiet then probe
  # each candidate's adverts through the partial index.
  adv_busiest: "SELECT observer_id FROM packet_observations WHERE id > (SELECT max(id) FROM packet_observations) - 5000000 GROUP BY 1 HAVING count(*) FILTER (WHERE payload_type = 4) > 0 ORDER BY count(*) FILTER (WHERE payload_type = 4) DESC, observer_id LIMIT 1"
  adv_busiest_mid: "SELECT (min(id) + max(id)) / 2 FROM packet_observations WHERE payload_type = 4 AND observer_id = (SELECT observer_id FROM packet_observations WHERE id > (SELECT max(id) FROM packet_observations) - 5000000 GROUP BY 1 HAVING count(*) FILTER (WHERE payload_type = 4) > 0 ORDER BY count(*) FILTER (WHERE payload_type = 4) DESC, observer_id LIMIT 1)"
  adv_dense1: "SELECT observer_id FROM packet_observations WHERE id > (SELECT max(id) FROM packet_observations) - 5000000 GROUP BY 1 HAVING count(*) >= 500 ORDER BY count(*) FILTER (WHERE payload_type = 4)::float8 / count(*) DESC, observer_id LIMIT 1"
  adv_dense2: "SELECT observer_id FROM packet_observations WHERE id > (SELECT max(id) FROM packet_observations) - 5000000 GROUP BY 1 HAVING count(*) >= 500 ORDER BY count(*) FILTER (WHERE payload_type = 4)::float8 / count(*) DESC, observer_id OFFSET 1 LIMIT 1"
  adv_mid: "SELECT observer_id FROM (SELECT observer_id, row_number() OVER (ORDER BY count(*) FILTER (WHERE payload_type = 4), observer_id) rn, count(*) OVER () n FROM packet_observations WHERE id > (SELECT max(id) FROM packet_observations) - 5000000 GROUP BY observer_id HAVING count(*) FILTER (WHERE payload_type = 4) > 0) s WHERE rn = (n + 1) / 2"
  adv_quiet: "SELECT w.observer_id FROM (SELECT observer_id, count(*) FILTER (WHERE payload_type = 4) n FROM packet_observations WHERE id > (SELECT max(id) FROM packet_observations) - 5000000 GROUP BY 1 HAVING count(*) FILTER (WHERE payload_type = 4) > 0) w WHERE NOT EXISTS (SELECT 1 FROM packet_observations x WHERE x.observer_id = w.observer_id AND x.payload_type = 4 OFFSET 50) ORDER BY w.n, w.observer_id LIMIT 1"
  adv_sparse: "SELECT observer_id FROM packet_observations WHERE id > (SELECT max(id) FROM packet_observations) - 5000000 GROUP BY 1 HAVING count(*) >= 500 AND count(*) FILTER (WHERE payload_type = 4) > 0 ORDER BY count(*) FILTER (WHERE payload_type = 4)::float8 / count(*), observer_id LIMIT 1"
  adv_topobs: "SELECT observer_id FROM packet_observations WHERE id > (SELECT max(id) FROM packet_observations) - 5000000 GROUP BY 1 ORDER BY count(*) DESC, observer_id LIMIT 1"
  adv_topobs_mid: "SELECT (min(id) + max(id)) / 2 FROM packet_observations WHERE payload_type = 4 AND observer_id = (SELECT observer_id FROM packet_observations WHERE id > (SELECT max(id) FROM packet_observations) - 5000000 GROUP BY 1 ORDER BY count(*) DESC, observer_id LIMIT 1)"
  adv_zero: "SELECT w.observer_id FROM (SELECT observer_id, count(*) n FROM packet_observations WHERE id > (SELECT max(id) FROM packet_observations) - 5000000 GROUP BY 1) w WHERE NOT EXISTS (SELECT 1 FROM packet_observations x WHERE x.observer_id = w.observer_id AND x.payload_type = 4) ORDER BY w.n DESC, w.observer_id LIMIT 1"
