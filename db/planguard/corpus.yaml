sort_exempt_sets:
  hop_group:
    - {relation: known_routes, index: idx_known_routes_hop_iata, index_cond: "hop_count =", reason: "a hop page sorts one (hop, region) group, bounded by the group size"}
  latest_observation:
    - {relation: packet_observations, index_cond: "packet_hash = p.packet_hash", reason: "the latest-observation LATERAL sorts one packet's observations (a few hundred at most)"}
  per_site_message_ranges:
    - {relation: packets, index: idx_packets_scope_last_heard, index_cond: "scope_id =", reason: "a scope's message page walks one scope's packets newest first and stops at the page"}
  route_search_top_n:
    - {relation: known_routes, index_cond: "node_ids &&", reason: "route search and cross sort their GIN matches for the top 500, as today"}
    - {relation: known_routes, index: idx_known_routes_iata_keyset, index_cond: "iata = ANY", reason: "the same top 500 when the region list is the narrower path"}
  sites_recheck:
    - {relation: packet_sites, index_cond: "packet_hash = ps.packet_hash", reason: "the cross-site re-check probes one packet's sites; the per-site ranges each have their own Limit"}
  window_branches:
    - {relation: packets, index: idx_packets_heard_inverted, reason: "branch 2 reads only the inverted rows (partial index)"}
    - {relation: packets, index: idx_packets_type_last_heard, index_cond: "payload_type = ANY", reason: "branch 1's type range is bounded by last_heard_at >= since"}

# The shapes a cached statement's entries must cover before gen-policy admits it. A statement with a hop parameter
# must also cover rare_hop and absent_hop.
admission_profiles:
  region_page: [dense, sparse, empty_region, stale_region, page1, deep, tie]
  global_page: [page1, deep, tie]
  region_list: [dense, sparse, empty_region, stale_region, page1, deep, tie, giant_list]
  by_id: [hit, miss]

resolvers:
  adv_busiest: "SELECT observer_id FROM packet_observations WHERE payload_type = 4 GROUP BY 1 ORDER BY count(*) DESC, observer_id LIMIT 1"
  adv_busiest_mid: "SELECT percentile_disc(0.5) WITHIN GROUP (ORDER BY id) FROM packet_observations WHERE payload_type = 4 AND observer_id = (SELECT observer_id FROM packet_observations WHERE payload_type = 4 GROUP BY 1 ORDER BY count(*) DESC, observer_id LIMIT 1)"
  adv_dense1: "SELECT observer_id FROM packet_observations GROUP BY 1 HAVING count(*) >= 500 ORDER BY count(*) FILTER (WHERE payload_type = 4)::float8 / count(*) DESC, observer_id LIMIT 1"
  adv_dense2: "SELECT observer_id FROM packet_observations GROUP BY 1 HAVING count(*) >= 500 ORDER BY count(*) FILTER (WHERE payload_type = 4)::float8 / count(*) DESC, observer_id OFFSET 1 LIMIT 1"
  adv_mid: "SELECT observer_id FROM (SELECT observer_id, row_number() OVER (ORDER BY count(*), observer_id) rn, count(*) OVER () n FROM packet_observations WHERE payload_type = 4 GROUP BY observer_id) s WHERE rn = (n + 1) / 2"
  adv_quiet: "SELECT observer_id FROM packet_observations GROUP BY 1 HAVING count(*) FILTER (WHERE payload_type = 4) > 0 ORDER BY count(*) FILTER (WHERE payload_type = 4), count(*) DESC, observer_id LIMIT 1"
  adv_sparse: "SELECT observer_id FROM packet_observations GROUP BY 1 HAVING count(*) >= 500 AND count(*) FILTER (WHERE payload_type = 4) > 0 ORDER BY count(*) FILTER (WHERE payload_type = 4)::float8 / count(*), observer_id LIMIT 1"
  adv_topobs: "SELECT observer_id FROM packet_observations GROUP BY 1 ORDER BY count(*) DESC, observer_id LIMIT 1"
  adv_topobs_mid: "SELECT percentile_disc(0.5) WITHIN GROUP (ORDER BY id) FROM packet_observations WHERE payload_type = 4 AND observer_id = (SELECT observer_id FROM packet_observations GROUP BY 1 ORDER BY count(*) DESC, observer_id LIMIT 1)"
  adv_zero: "SELECT observer_id FROM packet_observations GROUP BY 1 HAVING count(*) FILTER (WHERE payload_type = 4) = 0 ORDER BY count(*) DESC, observer_id LIMIT 1"
  allbogus: "SELECT array_agg(v ORDER BY v) FROM (SELECT name v FROM transport_scopes UNION ALL SELECT '#zz-bogus-' || g FROM generate_series(1, 5000) g) s"
  bogus5000: "SELECT array_agg('#zz-bogus-' || g ORDER BY g) FROM generate_series(1, 5000) g"
  bwe_deep_id: "SELECT id FROM known_routes WHERE iata >= 'BWE' AND iata <= 'BWE' ORDER BY iata, date_trunc('milliseconds', last_seen, 'UTC') DESC, id DESC OFFSET 5000 LIMIT 1"
  bwe_deep_ts: "SELECT date_trunc('milliseconds', last_seen, 'UTC') FROM known_routes WHERE iata >= 'BWE' AND iata <= 'BWE' ORDER BY iata, date_trunc('milliseconds', last_seen, 'UTC') DESC, id DESC OFFSET 5000 LIMIT 1"
  cm_newest_hash: "SELECT packet_hash FROM channel_messages ORDER BY id DESC LIMIT 1"
  cmi_all_sites: "SELECT array_agg(DISTINCT iata ORDER BY iata) FROM channel_message_iatas"
  cmi_bogus5000: "SELECT array_agg(c ORDER BY c) FROM (SELECT c FROM (SELECT chr(65 + a) || chr(65 + b) || chr(65 + d) c FROM generate_series(0, 25) a, generate_series(0, 25) b, generate_series(0, 25) d) g WHERE c NOT IN (SELECT DISTINCT iata FROM channel_message_iatas) AND c NOT IN (SELECT iata FROM iata_codes) ORDER BY c LIMIT 5000) s"
  g50_id: "SELECT id FROM known_routes ORDER BY date_trunc('milliseconds', last_seen, 'UTC') DESC, id DESC OFFSET 49 LIMIT 1"
  g50_ts: "SELECT date_trunc('milliseconds', last_seen, 'UTC') FROM known_routes ORDER BY date_trunc('milliseconds', last_seen, 'UTC') DESC, id DESC OFFSET 49 LIMIT 1"
  global_tie_id: "SELECT max(id) FROM known_routes WHERE date_trunc('milliseconds', last_seen, 'UTC') = (SELECT ts FROM (SELECT date_trunc('milliseconds', last_seen, 'UTC') ts FROM known_routes ORDER BY date_trunc('milliseconds', last_seen, 'UTC') DESC, id DESC LIMIT 20000) s GROUP BY ts HAVING count(*) > 1 ORDER BY ts DESC LIMIT 1)"
  global_tie_ts: "SELECT ts FROM (SELECT date_trunc('milliseconds', last_seen, 'UTC') ts FROM known_routes ORDER BY date_trunc('milliseconds', last_seen, 'UTC') DESC, id DESC LIMIT 20000) s GROUP BY ts HAVING count(*) > 1 ORDER BY ts DESC LIMIT 1"
  new50_id: "SELECT id FROM known_routes WHERE iata = 'NEW' ORDER BY iata, date_trunc('milliseconds', last_seen, 'UTC') DESC, id DESC OFFSET 49 LIMIT 1"
  new50_ts: "SELECT date_trunc('milliseconds', last_seen, 'UTC') FROM known_routes WHERE iata = 'NEW' ORDER BY iata, date_trunc('milliseconds', last_seen, 'UTC') DESC, id DESC OFFSET 49 LIMIT 1"
  nl12_judge_hash: "SELECT packet_hash FROM packet_sites WHERE iata = ANY('{AMS,EIN,ENS,GLZ,GRQ,LEY,LWR,MST,QAR,RTM,UDE,UTC}') AND site_heard_at <= timestamptz '2026-10-18 15:40:39.570763+00' ORDER BY site_heard_at DESC, packet_hash DESC LIMIT 1"
  nl12_judge_ts: "SELECT site_heard_at FROM packet_sites WHERE iata = ANY('{AMS,EIN,ENS,GLZ,GRQ,LEY,LWR,MST,QAR,RTM,UDE,UTC}') AND site_heard_at <= timestamptz '2026-10-18 15:40:39.570763+00' ORDER BY site_heard_at DESC, packet_hash DESC LIMIT 1"
  nodes_p500_id: "SELECT id FROM nodes ORDER BY last_seen DESC, id DESC OFFSET 500 LIMIT 1"
  nodes_p500_ts: "SELECT last_seen FROM nodes ORDER BY last_seen DESC, id DESC OFFSET 500 LIMIT 1"
  obs_newest_hash: "SELECT packet_hash FROM packet_observations ORDER BY id DESC LIMIT 1"
  obs_newest_observer: "SELECT observer_id FROM packet_observations ORDER BY id DESC LIMIT 1"
  pk_deep_hash: "SELECT packet_hash FROM packets ORDER BY last_heard_at DESC, packet_hash DESC OFFSET 100000 LIMIT 1"
  pk_deep_ts: "SELECT last_heard_at FROM packets ORDER BY last_heard_at DESC, packet_hash DESC OFFSET 100000 LIMIT 1"
  ps_all_sites: "SELECT array_agg(DISTINCT iata ORDER BY iata) FROM packet_sites WHERE iata <> 'NEW'"
  ps_bogus5000: "SELECT array_agg(c ORDER BY c) FROM (SELECT c FROM (SELECT chr(65 + a) || chr(65 + b) || chr(65 + d) c FROM generate_series(0, 25) a, generate_series(0, 25) b, generate_series(0, 25) d) g WHERE c NOT IN (SELECT DISTINCT iata FROM packet_sites) AND c NOT IN (SELECT iata FROM iata_codes) ORDER BY c LIMIT 5000) s"
  ps_kept: "SELECT array_agg(DISTINCT v ORDER BY v) FROM (SELECT ri.iata::text v FROM region_iatas ri JOIN regions r ON r.id = ri.region_id WHERE r.slug IN ('nl', 'pnw', 'gbr', 'cz', 'swe') UNION ALL SELECT unnest('{STR,MHG,FRA,CGN,DTM,ESS,DUS,BWE,RIX,YOW,MAD,DSM,ZZZ}'::text[])) s"
  ps_list_cz: "SELECT array_agg(ri.iata::text ORDER BY ri.iata) FROM region_iatas ri JOIN regions r ON r.id = ri.region_id WHERE r.slug = 'cz'"
  ps_list_dash8: "SELECT '{#pnw,#wa,#w-wa,#thurston,#pierce,#oly,#rainier,#tumwater}'::text[]"
  ps_list_gbr: "SELECT array_agg(ri.iata::text ORDER BY ri.iata) FROM region_iatas ri JOIN regions r ON r.id = ri.region_id WHERE r.slug = 'gbr'"
  ps_list_nl: "SELECT array_agg(ri.iata::text ORDER BY ri.iata) FROM region_iatas ri JOIN regions r ON r.id = ri.region_id WHERE r.slug = 'nl'"
  ps_list_pathfinder7: "SELECT '{STR,MHG,FRA,CGN,DTM,ESS,DUS}'::text[]"
  ps_list_pnw: "SELECT array_agg(ri.iata::text ORDER BY ri.iata) FROM region_iatas ri JOIN regions r ON r.id = ri.region_id WHERE r.slug = 'pnw'"
  ps_list_scopes1258: "SELECT array_agg(name ORDER BY name) FROM (SELECT name FROM transport_scopes ORDER BY name LIMIT 1258) s"
  ps_list_scopes_sea41: "SELECT array_agg(name ORDER BY name) FROM (SELECT name FROM transport_scopes ORDER BY name LIMIT 41) s"
  ps_pnw_tie_hash: "SELECT packet_hash FROM packet_sites WHERE iata = ANY('{BLI,CVO,KLS,LMT,MFR,MMV,ONP,PAE,PDX,RDM,SEA,SLE,TTD}') AND site_heard_at = (SELECT site_heard_at FROM packet_sites WHERE iata = ANY('{BLI,CVO,KLS,LMT,MFR,MMV,ONP,PAE,PDX,RDM,SEA,SLE,TTD}') AND site_heard_at > timestamptz '2026-10-18 06:00+00' GROUP BY 1 HAVING count(DISTINCT packet_hash) > 1 ORDER BY 1 DESC LIMIT 1) ORDER BY packet_hash DESC LIMIT 1"
  ps_pnw_tie_ts: "SELECT site_heard_at FROM packet_sites WHERE iata = ANY('{BLI,CVO,KLS,LMT,MFR,MMV,ONP,PAE,PDX,RDM,SEA,SLE,TTD}') AND site_heard_at > timestamptz '2026-10-18 06:00+00' GROUP BY 1 HAVING count(DISTINCT packet_hash) > 1 ORDER BY 1 DESC LIMIT 1"
  ps_sea_tie_hash: "SELECT packet_hash FROM packet_sites WHERE iata = 'SEA' AND site_heard_at = (SELECT site_heard_at FROM packet_sites WHERE iata = 'SEA' AND site_heard_at > timestamptz '2026-10-18 12:00+00' GROUP BY 1 HAVING count(*) > 1 ORDER BY 1 DESC LIMIT 1) ORDER BY packet_hash DESC LIMIT 1"
  ps_sea_tie_ts: "SELECT site_heard_at FROM packet_sites WHERE iata = 'SEA' AND site_heard_at > timestamptz '2026-10-18 12:00+00' GROUP BY 1 HAVING count(*) > 1 ORDER BY 1 DESC LIMIT 1"
