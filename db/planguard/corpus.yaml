# planguard corpus: which statements are planned, with which parameters, and what each plan must look like.
#
# Tiers (one corpus, three databases):
#   fixture  CI. A synthetic, skewed fixture built through the migrations; plain EXPLAIN only. Checks each plan's
#            shape (drivers, Index Cond fragments, forbidden nodes, the sort rule) and its signature against
#            baseline/fixture. Budgets are not checked, because nothing is executed.
#   local    The reference local copy of production. EXPLAIN (ANALYZE, BUFFERS) after the configured executions;
#            checks shapes, budgets and baseline/local. This is the release gate.
#   prod     Production, read-only plain EXPLAIN on the maint pool (custom and generic modes). Checks shapes only;
#            statistics drift is what it watches, so it keeps no baseline.
#
# Plan class (statement `plan:`) -> the modes its entries run when they name none:
#   cached   custom, generic, auto  admitted to the generic-plan class (planpolicy.Cached, written by gen-policy);
#                                   must pass every layout, and its entries' shapes must cover its admission profile
#   custom   custom                 sent unnamed, so no layout ever plans it generic
#   maint    custom                 the maint pool forces custom plans
#   ingest   auto                   the ingest pool keeps automatic plan caching
#   legacy   custom, generic, auto  planpolicy.Legacy: runs on api_legacy with automatic plan caching
#   harness  custom, generic, auto  planted regressions and oracles; never served
#
# Verdicts: a failing check is FALSE_POSITIVE (a real regression), a planted entry (expect_fail) that passes is
# MISSED; both fail the run, as does ERROR. RETIRED_INDEX, KNOWN_ISSUE and SKIP are reported only.
#
# A plan change updates the baseline in the same diff: run with --baseline write, review the signature diff and
# commit it with the change that caused it.

defaults:
  big_tables: [known_routes, packet_observations, packets, packet_sites]
  executions: 6
  timeout_s: 60
  forbid_sort_above_limit: true
  forbid:
    - {node: Seq Scan, relations: [big], reason: page statements never scan a big table}
  sort_exempt: [latest_observation]
  # Indexes the end state drops. A plan that fails only because it uses one of them is RETIRED_INDEX, not a failure.
  retired_indexes: [idx_known_routes_iata_last_seen, idx_known_routes_last_seen, idx_known_routes_hop_count, idx_known_routes_reconfirm,
                    idx_packets_last_heard, idx_packets_payload_type, idx_packets_route_type, idx_packets_scope,
                    idx_observations_packet, idx_observations_observer_id, idx_channel_messages_channel, idx_channel_messages_sent_brin]

tiers:
  fixture:
    search_path: public
    # The local copy's planner settings, so fixture plans match the reference copy's.
    settings: {effective_cache_size: 5GB, random_page_cost: "1.1", work_mem: 16MB}
  local:
    search_path: public
  prod: {}  # no search_path: the maint pool's own

groups:
  # Pending statements plan against an overlay schema on the local copy, which a later change builds.
  packets_global: {search_path: {local: "t_s2b, public"}}
  packet_sites: {search_path: {local: "t_s2b, public"}}
  channel_message_iatas: {search_path: {local: "t_s2b, public"}}
  stats_adverts: {search_path: {local: "t_s2b, public"}}

