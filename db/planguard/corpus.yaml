  # Lookup-table roles: the node with the most neighbor rows, the 60 IATAs with the most channel members, the scope
  # with the fewest rollup rows, and a first-heard window over the newest day of trace tags. Each reads one small table.
  lk_top_neighbor_node: "SELECT node_id FROM node_neighbors GROUP BY node_id ORDER BY count(*) DESC, node_id LIMIT 1"
  lk_member_iatas60: "SELECT array_agg(iata::bpchar ORDER BY n DESC, iata) FROM (SELECT iata, count(*) n FROM meshmapper_channel_members GROUP BY iata ORDER BY 2 DESC, 1 LIMIT 60) s"
  lk_rare_scope: "SELECT ts.name FROM transport_scopes ts JOIN analytics_hourly_scope_sets s ON s.scope_id = ts.id GROUP BY ts.id, ts.name ORDER BY count(*), ts.name LIMIT 1"
  lk_link_nodes40: "SELECT array_agg(node_id ORDER BY n DESC, node_id) FROM (SELECT node_id, count(*) n FROM node_neighbors GROUP BY node_id ORDER BY 2 DESC, 1 LIMIT 40) s"
  lk_link_neighbors40: "SELECT array_agg(neighbor_id ORDER BY n DESC, neighbor_id) FROM (SELECT neighbor_id, count(*) n FROM node_neighbors GROUP BY neighbor_id ORDER BY 2 DESC, 1 LIMIT 40) s"
  # Slow-pool roles: the three payload types with the fewest packets among the newest 50,000, a one-hour window 60
  # hours before the newest observation, every known IATA, and the busiest scope among the newest 20,000 messages.
  lk_trace_since: "SELECT max(first_heard_at) - interval '1 day' FROM trace_tags"
  lk_trace_until: "SELECT max(first_heard_at) - interval '12 hours' FROM trace_tags"
  tel_top: "SELECT observer_id FROM observer_telemetry WHERE id > (SELECT max(id) FROM observer_telemetry) - 200000 GROUP BY 1 ORDER BY count(*) DESC, observer_id LIMIT 1"
  tel_top_mid: "SELECT percentile_disc(0.5) WITHIN GROUP (ORDER BY id) FROM observer_telemetry WHERE observer_id = (SELECT observer_id FROM observer_telemetry WHERE id > (SELECT max(id) FROM observer_telemetry) - 200000 GROUP BY 1 ORDER BY count(*) DESC, observer_id LIMIT 1)"
  trc_tie_tag: "SELECT trace_tag FROM trace_tags WHERE date_trunc('milliseconds', last_heard_at, 'UTC') = (SELECT ts FROM (SELECT date_trunc('milliseconds', last_heard_at, 'UTC') ts FROM trace_tags ORDER BY date_trunc('milliseconds', last_heard_at, 'UTC') DESC, trace_tag DESC LIMIT 20000) s GROUP BY ts HAVING count(*) > 1 ORDER BY ts DESC LIMIT 1) ORDER BY date_trunc('milliseconds', last_heard_at, 'UTC') DESC, trace_tag DESC LIMIT 1"
  trc_tie_ts: "SELECT ts FROM (SELECT date_trunc('milliseconds', last_heard_at, 'UTC') ts FROM trace_tags ORDER BY date_trunc('milliseconds', last_heard_at, 'UTC') DESC, trace_tag DESC LIMIT 20000) s GROUP BY ts HAVING count(*) > 1 ORDER BY ts DESC LIMIT 1"
  ustie_hash: "SELECT packet_hash FROM packets WHERE last_heard_at = (SELECT last_heard_at FROM packets GROUP BY last_heard_at HAVING count(*) > 1 ORDER BY last_heard_at DESC LIMIT 1) ORDER BY packet_hash DESC LIMIT 1"
  ustie_ts: "SELECT last_heard_at FROM packets GROUP BY last_heard_at HAVING count(*) > 1 ORDER BY last_heard_at DESC LIMIT 1"
  x_0355_i: "WITH cand AS (SELECT h.hx, ns.iata, ns.node_id FROM (VALUES ('0355')) h(hx) JOIN node_short_ids ns ON (length(h.hx) = 2 AND ns.prefix_1 = decode(h.hx, 'hex')) OR (length(h.hx) = 4 AND ns.prefix_2 = decode(h.hx, 'hex')) JOIN nodes n ON n.id = ns.node_id AND n.node_type IN (2, 3) WHERE ns.iata IN (SELECT iata FROM iata_codes)) SELECT array_agg(u.iata ORDER BY u.iata) FROM (SELECT iata, min(node_id::text)::uuid node_id FROM cand GROUP BY iata HAVING count(*) = 1) u HAVING count(*) <= 50"
