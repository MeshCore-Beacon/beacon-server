sort_exempt_sets:
  hop_group:
    - {relation: known_routes, index: idx_known_routes_hop_iata, index_cond: "hop_count =", reason: "a hop page sorts one (hop, region) group, bounded by the group size"}
  hop_gate:
    - {relation: known_routes, index_cond: "hop_count =", reason: "a global hop page reads and sorts its hop group when the store estimates the group under the bound"}
  hop_tail:
    - {relation: known_routes, index_cond: "hop_count =", reason: "below a deep cursor today's global hop statement sorts the rest of the hop group (a bitmap AND of the keyset and hop indexes)"}
  latest_observation:
    - {relation: packet_observations, index_cond: "packet_hash = p.packet_hash", reason: "the latest-observation LATERAL sorts one packet's observations (a few hundred at most)"}
  route_search_top_n:
    - {relation: known_routes, index_cond: "node_ids &&", reason: "route search and cross sort their GIN matches for the top 500, as today"}
    - {relation: known_routes, index: idx_known_routes_iata_keyset, index_cond: "iata = ANY", reason: "the same top 500 when the region list is the narrower path"}
  sites_recheck:
    - {relation: packet_sites, index_cond: "packet_hash = ps.packet_hash", reason: "the cross-site re-check probes one packet's sites; the per-site ranges each have their own Limit"}
  bounded_scan:
    - {relation: packet_sites, index_cond: "packet_hash = s.packet_hash", reason: "the bounded forms re-check each packet read from at most scan_depth entries per range"}
  window_skew:
    - {relation: packet_sites, index: idx_packet_sites_early, reason: "the rows heard at a site over 30 minutes before their first hearing: ingest clamps hearing times to 30 minutes of its clock, so the index stays about empty"}
    - {relation: packet_sites, index_cond: "packet_hash = e.packet_hash", reason: "the re-check of an early row probes one packet's sites"}
    - {relation: packet_sites, index_cond: "packet_hash = ps_", reason: "the re-check of a late row probes one packet's sites"}
  window_rare_type:
    - {relation: packet_sites, index: idx_packet_sites_site_type, sort: Sort, reason: "a rare type above the typed cap: the planner may sort that type's entries below the page start, bounded by how many the type has at the site"}
  window_typed_late:
    - {relation: packet_sites, index: idx_packet_sites_late, sort: Sort, reason: "the late rows above hi that carry the requested types: a small share of the window above until"}
  window_branches:
    - {relation: packets, index: idx_packets_heard_inverted, reason: "branch 2 reads only the inverted rows (partial index)"}
    - {relation: packets, index: idx_packets_type_last_heard, index_cond: "payload_type = ANY", reason: "branch 1's type range is bounded by last_heard_at >= since"}
    - {relation: packets, index: idx_packets_last_heard, index_cond: "last_heard_at >=", sort: Incremental Sort, reason: "branch 1 reads last_heard_at >= since in order; its Incremental Sort only orders packets that share a last_heard_at"}
  scope_rare_type:
    - {relation: packets, index_cond: "payload_type = ANY", sort: Sort, reason: "a rare type in named scopes: the planner ANDs the scope and type indexes, and the Sort holds that type's packets in those scopes"}
  rare_type_window:
    - {relation: packets, index: idx_packets_payload_type, index_cond: "payload_type = ANY", sort: Sort, reason: "a rare type: the Sort holds every packet of the type, bounded by how many it has"}
  since_messages:
    - {relation: packet_observations, index: idx_observations_packet, sort: Sort, reason: "one probe per message the since range returns"}
    - {relation: packets, index: packets_pkey, sort: Sort, reason: "one probe per message the since range returns"}
    - {relation: packets, index: idx_packets_scope, index_cond: "scope_id =", sort: Sort, reason: "the scope's packets, joined to the messages sent since"}
    - {relation: packets, index: idx_packets_scope_last_heard, sort: Sort, reason: "the scope's packets, joined to the messages sent since (at most 5,000 when sites ask, by their count)"}

# The shapes a cached statement's entries must cover before gen-policy admits it. A statement with a hop parameter
# must also cover rare_hop and absent_hop.
admission_profiles:
  region_page: [dense, sparse, empty_region, stale_region, page1, deep, tie]
  global_page: [page1, deep, tie]
  region_list: [dense, sparse, empty_region, stale_region, page1, deep, tie, giant_list]
  by_id: [hit, miss]
  observer_page: [hit, miss, page1, deep, past_end]

resolvers:
  # packet_sites roles (see the packet_sites entries).
  obs_newest_heard_at: "SELECT heard_at FROM packet_observations ORDER BY id DESC LIMIT 1"
  obs_newest_iata: "SELECT iata FROM packet_observations ORDER BY id DESC LIMIT 1"
  ps_all_sites: "SELECT array_agg(c.iata ORDER BY c.iata) FROM iata_codes c WHERE EXISTS (SELECT 1 FROM packet_sites ps WHERE ps.iata = c.iata)"
  ps_audit_lo: "SELECT max(id) - 840000 FROM packet_observations"
  ps_bogus5000: "SELECT array_agg(c ORDER BY c) FROM (SELECT c FROM (SELECT chr(65 + a) || chr(65 + b) || chr(65 + d) c FROM generate_series(0, 25) a, generate_series(0, 25) b, generate_series(0, 25) d) g WHERE NOT EXISTS (SELECT 1 FROM iata_codes ic WHERE ic.iata = g.c) ORDER BY c LIMIT 5000) s"
  ps_busy13_1d: "SELECT (SELECT max((SELECT max(site_heard_at) FROM packet_sites ps WHERE ps.iata = r.iata)) FROM (SELECT po.iata, count(*) n FROM packet_observations po WHERE po.id > (SELECT max(id) - 200000 FROM packet_observations) GROUP BY po.iata ORDER BY n DESC, po.iata LIMIT 13) r) - interval '1 day'"
  ps_busy13_2_5d: "SELECT (SELECT max((SELECT max(site_heard_at) FROM packet_sites ps WHERE ps.iata = r.iata)) FROM (SELECT po.iata, count(*) n FROM packet_observations po WHERE po.id > (SELECT max(id) - 200000 FROM packet_observations) GROUP BY po.iata ORDER BY n DESC, po.iata LIMIT 13) r) - interval '60 hours'"
  ps_busy13_75m: "SELECT (SELECT max((SELECT max(site_heard_at) FROM packet_sites ps WHERE ps.iata = r.iata)) FROM (SELECT po.iata, count(*) n FROM packet_observations po WHERE po.id > (SELECT max(id) - 200000 FROM packet_observations) GROUP BY po.iata ORDER BY n DESC, po.iata LIMIT 13) r) - interval '75 minutes'"
  ps_busy13_75m_lo: "SELECT (SELECT max((SELECT max(site_heard_at) FROM packet_sites ps WHERE ps.iata = r.iata)) FROM (SELECT po.iata, count(*) n FROM packet_observations po WHERE po.id > (SELECT max(id) - 200000 FROM packet_observations) GROUP BY po.iata ORDER BY n DESC, po.iata LIMIT 13) r) - interval '105 minutes'"
  ps_busy13_1d_hi: "SELECT (SELECT max((SELECT max(site_heard_at) FROM packet_sites ps WHERE ps.iata = r.iata)) FROM (SELECT po.iata, count(*) n FROM packet_observations po WHERE po.id > (SELECT max(id) - 200000 FROM packet_observations) GROUP BY po.iata ORDER BY n DESC, po.iata LIMIT 13) r) - interval '1 day' + interval '30 minutes'"
  ps_busy13_1d_6h: "SELECT (SELECT max((SELECT max(site_heard_at) FROM packet_sites ps WHERE ps.iata = r.iata)) FROM (SELECT po.iata, count(*) n FROM packet_observations po WHERE po.id > (SELECT max(id) - 200000 FROM packet_observations) GROUP BY po.iata ORDER BY n DESC, po.iata LIMIT 13) r) - interval '30 hours'"
  ps_busy13_2_5d_lo: "SELECT (SELECT max((SELECT max(site_heard_at) FROM packet_sites ps WHERE ps.iata = r.iata)) FROM (SELECT po.iata, count(*) n FROM packet_observations po WHERE po.id > (SELECT max(id) - 200000 FROM packet_observations) GROUP BY po.iata ORDER BY n DESC, po.iata LIMIT 13) r) - interval '60 hours 30 minutes'"
  ps_busy13_2_5d_1h: "SELECT (SELECT max((SELECT max(site_heard_at) FROM packet_sites ps WHERE ps.iata = r.iata)) FROM (SELECT po.iata, count(*) n FROM packet_observations po WHERE po.id > (SELECT max(id) - 200000 FROM packet_observations) GROUP BY po.iata ORDER BY n DESC, po.iata LIMIT 13) r) - interval '59 hours'"
  ps_busy13_2_5d_1h_hi: "SELECT (SELECT max((SELECT max(site_heard_at) FROM packet_sites ps WHERE ps.iata = r.iata)) FROM (SELECT po.iata, count(*) n FROM packet_observations po WHERE po.id > (SELECT max(id) - 200000 FROM packet_observations) GROUP BY po.iata ORDER BY n DESC, po.iata LIMIT 13) r) - interval '58 hours 30 minutes'"
  ps_busy1_1d_hi: "SELECT (SELECT max(site_heard_at) FROM packet_sites WHERE iata = (SELECT iata FROM (SELECT po.iata, count(*) n FROM packet_observations po WHERE po.id > (SELECT max(id) - 200000 FROM packet_observations) GROUP BY po.iata ORDER BY n DESC, po.iata LIMIT 1) r)) - interval '1 day' + interval '30 minutes'"
  ps_busy1_future_lo: "SELECT (SELECT max(site_heard_at) FROM packet_sites WHERE iata = (SELECT iata FROM (SELECT po.iata, count(*) n FROM packet_observations po WHERE po.id > (SELECT max(id) - 200000 FROM packet_observations) GROUP BY po.iata ORDER BY n DESC, po.iata LIMIT 1) r)) + interval '1 day' - interval '30 minutes'"
  ps_max_hash: "SELECT decode(repeat('ff', 64), 'hex')"
  ps_all_scope_names: "SELECT array_agg(name ORDER BY name) FROM transport_scopes"
  ps_busy13_tie_hash: "SELECT packet_hash FROM packet_sites WHERE iata = ANY(ARRAY(SELECT iata FROM (SELECT po.iata, count(*) n FROM packet_observations po WHERE po.id > (SELECT max(id) - 200000 FROM packet_observations) GROUP BY po.iata ORDER BY n DESC, po.iata LIMIT 13) r)) AND site_heard_at = (SELECT site_heard_at FROM packet_sites WHERE iata = ANY(ARRAY(SELECT iata FROM (SELECT po.iata, count(*) n FROM packet_observations po WHERE po.id > (SELECT max(id) - 200000 FROM packet_observations) GROUP BY po.iata ORDER BY n DESC, po.iata LIMIT 13) r)) AND site_heard_at > (SELECT max((SELECT max(site_heard_at) FROM packet_sites ps WHERE ps.iata = r.iata)) FROM (SELECT po.iata, count(*) n FROM packet_observations po WHERE po.id > (SELECT max(id) - 200000 FROM packet_observations) GROUP BY po.iata ORDER BY n DESC, po.iata LIMIT 13) r) - interval '6 hours' GROUP BY 1 HAVING count(DISTINCT packet_hash) > 1 ORDER BY 1 DESC LIMIT 1) ORDER BY packet_hash DESC LIMIT 1"
  ps_busy13_tie_ts: "SELECT site_heard_at FROM packet_sites WHERE iata = ANY(ARRAY(SELECT iata FROM (SELECT po.iata, count(*) n FROM packet_observations po WHERE po.id > (SELECT max(id) - 200000 FROM packet_observations) GROUP BY po.iata ORDER BY n DESC, po.iata LIMIT 13) r)) AND site_heard_at > (SELECT max((SELECT max(site_heard_at) FROM packet_sites ps WHERE ps.iata = r.iata)) FROM (SELECT po.iata, count(*) n FROM packet_observations po WHERE po.id > (SELECT max(id) - 200000 FROM packet_observations) GROUP BY po.iata ORDER BY n DESC, po.iata LIMIT 13) r) - interval '6 hours' GROUP BY 1 HAVING count(DISTINCT packet_hash) > 1 ORDER BY 1 DESC LIMIT 1"
  ps_busy1_1d: "SELECT (SELECT max(site_heard_at) FROM packet_sites WHERE iata = (SELECT iata FROM (SELECT po.iata, count(*) n FROM packet_observations po WHERE po.id > (SELECT max(id) - 200000 FROM packet_observations) GROUP BY po.iata ORDER BY n DESC, po.iata LIMIT 1) r)) - interval '1 day'"
