  # The SEA relay cases read only the newest 5,000 SEA routes through the region keyset index, so they stay
  # far below the prod tier's 20 s cap even on a cold heap (0.02-0.12 s each on the reference copy). The rare relay
  # is also held to 20-80 SEA routes in total, counted among at most 500 of its routes through the node_ids GIN
  # index for the 50 rarest recent candidates only.
  s_sea_pop_f: "SELECT ARRAY[p.n] FROM (SELECT u.n FROM (SELECT kr.node_ids FROM known_routes kr WHERE kr.iata >= 'SEA' AND kr.iata <= 'SEA' ORDER BY kr.iata, date_trunc('milliseconds', kr.last_seen, 'UTC') DESC, kr.id DESC LIMIT 5000) r, unnest(r.node_ids) u(n) WHERE u.n IN (SELECT ns.node_id FROM node_short_ids ns JOIN nodes n ON n.id = ns.node_id AND n.node_type IN (2, 3) WHERE ns.iata = 'SEA') GROUP BY u.n ORDER BY count(*) DESC, u.n OFFSET 0 LIMIT 1) p"
  s_sea_pop_t: "SELECT ARRAY[p.n] FROM (SELECT u.n FROM (SELECT kr.node_ids FROM known_routes kr WHERE kr.iata >= 'SEA' AND kr.iata <= 'SEA' ORDER BY kr.iata, date_trunc('milliseconds', kr.last_seen, 'UTC') DESC, kr.id DESC LIMIT 5000) r, unnest(r.node_ids) u(n) WHERE u.n IN (SELECT ns.node_id FROM node_short_ids ns JOIN nodes n ON n.id = ns.node_id AND n.node_type IN (2, 3) WHERE ns.iata = 'SEA') GROUP BY u.n ORDER BY count(*) DESC, u.n OFFSET 1 LIMIT 1) p"
  s_sea_prefix_2525: "SELECT array_agg(ns.node_id ORDER BY ns.node_id) FROM node_short_ids ns JOIN nodes n ON n.id = ns.node_id AND n.node_type IN (2, 3) WHERE ns.iata = 'SEA' AND ns.prefix_2 = '\\x2525'"
  s_sea_prefix_fade: "SELECT array_agg(ns.node_id ORDER BY ns.node_id) FROM node_short_ids ns JOIN nodes n ON n.id = ns.node_id AND n.node_type IN (2, 3) WHERE ns.iata = 'SEA' AND ns.prefix_2 = '\\xfade'"
  s_sea_rare_t: "WITH recent AS MATERIALIZED (SELECT u.n, count(*) c FROM (SELECT kr.node_ids FROM known_routes kr WHERE kr.iata >= 'SEA' AND kr.iata <= 'SEA' ORDER BY kr.iata, date_trunc('milliseconds', kr.last_seen, 'UTC') DESC, kr.id DESC LIMIT 5000) r, unnest(r.node_ids) u(n) GROUP BY u.n HAVING count(*) >= 2), cand AS MATERIALIZED (SELECT c.n, c.c FROM recent c JOIN node_short_ids ns ON ns.node_id = c.n AND ns.iata = 'SEA' WHERE (SELECT count(*) FROM node_short_ids x JOIN nodes nn ON nn.id = x.node_id AND nn.node_type IN (2, 3) WHERE x.iata = 'SEA' AND x.prefix_2 = ns.prefix_2) = 1 ORDER BY c.c, c.n LIMIT 50) SELECT ARRAY[cand.n] FROM cand WHERE (SELECT count(*) FILTER (WHERE t.iata = 'SEA') FROM (SELECT k.iata FROM known_routes k WHERE k.node_ids @> ARRAY[cand.n] LIMIT 500) t) BETWEEN 20 AND 80 ORDER BY cand.c, cand.n LIMIT 1"
  sea50_id: "SELECT id FROM known_routes WHERE iata = 'SEA' ORDER BY iata, date_trunc('milliseconds', last_seen, 'UTC') DESC, id DESC OFFSET 49 LIMIT 1"
  sea50_ts: "SELECT date_trunc('milliseconds', last_seen, 'UTC') FROM known_routes WHERE iata = 'SEA' ORDER BY iata, date_trunc('milliseconds', last_seen, 'UTC') DESC, id DESC OFFSET 49 LIMIT 1"
  # Deep cursors a tenth of the way from the oldest route to the newest (SEA's here, all routes' in routes_deep_ts),
  # so they stay inside the data as retention moves its oldest end.
  sea_deep_ts: "SELECT date_trunc('milliseconds', o.ts + (n.ts - o.ts) / 10, 'UTC') FROM (SELECT date_trunc('milliseconds', last_seen, 'UTC') ts FROM known_routes WHERE iata >= 'SEA' AND iata <= 'SEA' ORDER BY iata DESC, date_trunc('milliseconds', last_seen, 'UTC'), id LIMIT 1) o, (SELECT date_trunc('milliseconds', last_seen, 'UTC') ts FROM known_routes WHERE iata >= 'SEA' AND iata <= 'SEA' ORDER BY iata, date_trunc('milliseconds', last_seen, 'UTC') DESC, id DESC LIMIT 1) n"
  sea_i: "SELECT '{SEA}'::bpchar[]"
  sea_tie_id: "SELECT max(id) FROM known_routes WHERE iata >= 'SEA' AND iata <= 'SEA' AND date_trunc('milliseconds', last_seen, 'UTC') = (SELECT ts FROM (SELECT date_trunc('milliseconds', last_seen, 'UTC') ts FROM known_routes WHERE iata >= 'SEA' AND iata <= 'SEA' ORDER BY iata, date_trunc('milliseconds', last_seen, 'UTC') DESC, id DESC LIMIT 20000) s GROUP BY ts HAVING count(*) > 1 ORDER BY ts DESC LIMIT 1)"
  sea_tie_ts: "SELECT ts FROM (SELECT date_trunc('milliseconds', last_seen, 'UTC') ts FROM known_routes WHERE iata >= 'SEA' AND iata <= 'SEA' ORDER BY iata, date_trunc('milliseconds', last_seen, 'UTC') DESC, id DESC LIMIT 20000) s GROUP BY ts HAVING count(*) > 1 ORDER BY ts DESC LIMIT 1"
