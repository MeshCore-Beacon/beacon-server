    params: [null, 5, "\\x01", "\\x0102030405060708"]
    expect:
      # Either single-row unique probe: on freshly built indexes the (channel_hash, key_fingerprint) unique index
      # can cost less than the primary key.
      driver: [{relation: channels, any_index: [channels_pkey, channels_channel_hash_key_fingerprint_key]}]
  # Not on the fixture: which of its two unique probes the planner takes flips with how fresh the indexes are, so
