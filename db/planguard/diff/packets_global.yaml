        cands:
          - {stmt: page, params: ["2026-10-18 16:59:57.721+00", "\\x", 51]}
        key: [last_heard_at]
        allowed: [tie_order, latest_observer_tie]
        omit: &latest [latest_observer_id, latest_observer_name, latest_observer_iata, latest_observer_path_length_byte,
          latest_observer_hash_size, latest_observer_hop_count, latest_observer_path_bytes]
        expect: {page: identical}
      # cursor 1ms [pt - rt - scopes 0 since - until - cursor_ms 1 limit 50]
