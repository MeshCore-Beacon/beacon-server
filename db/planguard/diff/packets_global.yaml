# Global /packets pages: the single ListPackets statement the server ran before (old:) against the per-shape
# statements that replace it (new:), one pair per corpus case of the packets_global group (same ids without "pk.").
# The ref gets the params the server used to send for the request (raw type and scope lists, NULL for an absent
# filter, the millisecond cursor, limit+1); the cand gets the params it sends now (normalised lists, -infinity and
# infinity for absent bounds, the cursor as a timestamp and an empty hash, or the exact page cursor).
#
# Needs the overlay overlay/packets_global.sql (schema t_s5a). Run it with walks:
#   planguard diff --old-ref origin/dev --cases db/planguard/diff/packets_global.yaml --walk 1,2,3,web --dsn ...
# then DROP SCHEMA t_s5a CASCADE.
#
# Only the named classes may differ: rows tied on last_heard_at come out in packet_hash order (tie_order), the
# latest observer of a packet whose newest observations share heard_at is the highest id (latest_observer_tie),
# and a page cursor returns the rows of its own millisecond that the legacy cursor skips (pagecursor_tie_rows).
#
# The walk pairs page through the new statements with their exact cursor at 1, 2, 3 and web_limit rows a page
# and compare every page with an oracle: the old statement's filter in the exact (last_heard_at, packet_hash)
# order, read as one page of max_rows. A walk must return the oracle's rows, each once, in its order.
#
# The cases use fixed times from a 2026-10-18 snapshot (T0 17:00 UTC): they mean something only on a copy that
# holds data around those times.
batches:
  - name: packets_global
    search_path: "t_s5a, public"
    statements:
      old: "old:ListPackets"
      page: "new:ListPacketsPage"
      types: "new:ListPacketsByTypes"
      scopes: "new:ListPacketsByScopes"
      scopes_types: "new:ListPacketsByScopesTypes"
      window: "new:ListPacketsWindow"
      window_scoped: "new:ListPacketsWindowScoped"
      oracle_page: "file:sql/oracle/OraclePacketsPage.sql"
      oracle_types: "file:sql/oracle/OraclePacketsByTypes.sql"
      oracle_scopes_types: "file:sql/oracle/OraclePacketsByScopesTypes.sql"
      oracle_window: "file:sql/oracle/OraclePacketsWindow.sql"
    pairs:
      # [pt - rt - scopes 0 since - until - cursor_ms 1792342797721 limit 50]
