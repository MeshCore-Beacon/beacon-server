# Planted regression: ListPacketsBySites as first proposed (rm: a per-site LIMIT before the cross-site re-check)
# loses rows; the end-state statement (end: the re-check inside each per-site range) does not.
#
# Needs the overlay overlay/packet_sites_walk.sql (schema t_s2b, the 12 sites below). Run it with walks:
#   planguard diff --old-ref origin/dev --cases db/planguard/diff/planted_readmodels.yaml --walk 1,2,3,web --dsn ...
# then DROP SCHEMA t_s2b CASCADE. Without --walk, nl.walk compares the first page only, where rm is usually right.
#
# The legacy pairs compare today's ListPacketsByIATAs (millisecond cursor, a saturating per-site scan, the latest
# observer picked without a tie-break) with the packet_sites statements at the same cursor: the named classes cover
# exactly those differences, and nothing else may differ.
batches:
  - name: planted_readmodels
    search_path: "t_s2b, public"
    statements:
      old: "old:ListPacketsByIATAs"
      rm: "file:sql/planted/ListPacketsBySitesReadmodels.sql"
      end: "file:sql/pending/ListPacketsBySites.sql"
      oracle: "file:sql/oracle/OracleBySites.sql"
    pairs:
      # Every page boundary from the first page: ref = the oracle (packet_observations, independent of
      # packet_sites) fetched as one page, cands walked as the client walks them.
      - id: nl.walk
        ref: {stmt: oracle, params: [&nl "{AMS,EIN,ENS,GLZ,GRQ,LEY,LWR,MST,QAR,RTM,UDE,UTC}", infinity, '\x', 2]}
        cands:
          - {stmt: rm, params: [*nl, infinity, '\x', 2]}
          - {stmt: end, params: [*nl, infinity, '\x', 2]}
        key: [site_heard_at]
        walk:
          limit_param: 4
          fetch_extra: 1
          cursor: [{param: 2, column: site_heard_at}, {param: 3, column: packet_hash}]
          first: [infinity, '\x']
          web_limit: 50
          oracle: true
        expect: {rm: different, end: same}

      # Today's statement at a millisecond cursor, with the server's parameters for limit 1 (scan depth
      # (limit+1)*8, page limit+1). A cursor (t, '\x') is "below t", the same rows as the legacy cursor.
      - id: nl.l1.legacy.judge1
        ref: {stmt: old, params: [*nl, "2026-10-18 15:40:39.570+00", null, null, null, null, null, 16, 2]}
        cands:
          - {stmt: rm, params: [*nl, "2026-10-18 15:40:39.57+00", '\x', 2]}
          - {stmt: end, params: [*nl, "2026-10-18 15:40:39.57+00", '\x', 2]}
        key: [site_heard_at]
        allowed: [tie_order, saturated_suffix, latest_observer_tie]
        omit: &latest [latest_observer_id, latest_observer_name, latest_observer_iata, latest_observer_path_length_byte,
          latest_observer_hash_size, latest_observer_hop_count, latest_observer_path_bytes]
        saturated: {flag: scan_saturated, floor: scan_floor}
        expect: {rm: different, end: same}
      - id: nl.l1.legacy.judge2
        ref: {stmt: old, params: [*nl, "2026-10-18 15:24:51.737+00", null, null, null, null, null, 16, 2]}
        cands:
          - {stmt: end, params: [*nl, "2026-10-18 15:24:51.737+00", '\x', 2]}
        key: [site_heard_at]
        allowed: [tie_order, saturated_suffix, latest_observer_tie]
        omit: *latest
        saturated: {flag: scan_saturated, floor: scan_floor}
        expect: {end: same}

      # The page cursor (exact microseconds and a hash bound) against the legacy millisecond cursor: the cand may
      # lead with rows in the cursor's millisecond that the legacy page leaves out.
      - id: nl.l1.pagecursor.tie
        ref: {stmt: old, params: [*nl, "2026-10-18 15:40:39.570+00", null, null, null, null, null, 16, 2]}
        cands:
          - {stmt: end, params: [*nl, "2026-10-18 15:40:39.570763+00", '\xff', 2]}
        key: [site_heard_at]
        allowed: [pagecursor_tie_rows, tie_order, saturated_suffix, latest_observer_tie]
        tie_boundary: 2
        omit: *latest
        saturated: {flag: scan_saturated, floor: scan_floor}
        expect: {end: same}

      # Control: a shape where rm is right, so a diff that flags everything would show here.
      - id: nl.l50.first
        ref: {stmt: oracle, params: [*nl, infinity, '\x', 51]}
        cands:
          - {stmt: rm, params: [*nl, infinity, '\x', 51]}
          - {stmt: end, params: [*nl, infinity, '\x', 51]}
        key: [site_heard_at]
        expect: {rm: same, end: same}
