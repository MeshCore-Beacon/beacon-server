# Channel message pages: today's two statements (old:) against the statement the server now runs for each request
# shape (new:), on the overlay overlay/channel_message_iatas.sql (schema t_s4a). Every pair must return identical
# rows: no result-change class applies. Cursor 0 (today's "no cursor") is the new statements' 9223372036854775807;
# every other cursor is passed as given. Limits are the server's limit + 1. Sites with a since or a scope across every
# channel run today's statement itself, so they have no pair here.
#
# Channels, sites and scopes are picked by role among the newest 20,000 channel_message_iatas rows; cursors come from
# each shape's own newest 5,000 ids (the median, the tenth percentile, the 50th). Since times count back from the newest message.
#   psql "$DSN" -v ON_ERROR_STOP=1 -f db/planguard/overlay/channel_message_iatas.sql
#   planguard diff --old-ref 119e23f --cases db/planguard/diff/channel_message_iatas.yaml --dsn ...
# then DROP SCHEMA t_s4a CASCADE. Cursor chains are walked by storediff/channel_message_iatas.yaml.
batches:
  - name: channel_message_iatas
    search_path: "t_s4a, public"
    statements:
      old: "old:ListChannelMessages"
      oldall: "old:ListAllChannelMessages"
      by: "new:ListChannelMessagesByIATAs"
      bysc: "new:ListChannelMessagesByIATAsScoped"
      plain: "new:ListChannelMessagesPlain"
      plainsc: "new:ListChannelMessagesPlainScoped"
      walk: "new:ListChannelMessagesSinceWalk"
      aby: "new:ListAllChannelMessagesByIATAs"
      aplain: "new:ListAllChannelMessagesPlain"
      aplainsc: "new:ListAllChannelMessagesPlainScoped"
      asince: "new:ListAllChannelMessagesSince"
    pairs:
      - id: ch.site.c0.l2
        ref: {stmt: old, params: [{sql: "SELECT (SELECT channel_id FROM channel_message_iatas WHERE message_id > (SELECT coalesce((SELECT message_id FROM channel_message_iatas ORDER BY message_id DESC OFFSET 20000 LIMIT 1), 0)) GROUP BY 1 ORDER BY count(*) DESC, 1 OFFSET 0 LIMIT 1)"}, null, {sql: "SELECT ARRAY[(SELECT iata FROM channel_message_iatas WHERE message_id > (SELECT coalesce((SELECT message_id FROM channel_message_iatas ORDER BY message_id DESC OFFSET 20000 LIMIT 1), 0)) AND channel_id = (SELECT channel_id FROM channel_message_iatas WHERE message_id > (SELECT coalesce((SELECT message_id FROM channel_message_iatas ORDER BY message_id DESC OFFSET 20000 LIMIT 1), 0)) GROUP BY 1 ORDER BY count(*) DESC, 1 OFFSET 0 LIMIT 1) GROUP BY 1 ORDER BY count(*) DESC, 1 LIMIT 1)]::bpchar[]"}, "", 0, 2]}
