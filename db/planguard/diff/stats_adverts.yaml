# Stats, series, traces, telemetry and adverts: the statements the server ran before (old:) against the ones that
# replace them (new:). Every pair must return identical rows: no result-change class applies.
#   stats      GetTopNodes, GetStatsTopAdvertisers and GetPathStats against their per (hour, IATA) probes, for lists
#              of at most 32 distinct IATAs (wider lists keep today's statement, so Go never pairs them);
#   series     GetStatsSeries before and after its IATA-set branches pre-filter on [since, until);
#   traces     ListTraceTags before and after its row-comparison keyset;
#   telemetry  GetObserverTelemetry with no end against GetObserverTelemetrySince;
#   adverts    ListObserverAdverts filtered on the packet's payload type against the observation's own, on the
#              overlay overlay/stats_adverts.sql (schema t_s7a); the walks page both from the start, 1, 2, 3 and 50
#              rows a page, and must return the same rows, each once, in id order.
#
# The old texts are those of 41baee9, before this change. Run:
#   psql "$DSN" -v ON_ERROR_STOP=1 -f db/planguard/overlay/stats_adverts.sql
#   planguard diff --old-ref 41baee9 --cases db/planguard/diff/stats_adverts.yaml --walk 1,2,3,web --dsn ...
# then DROP SCHEMA t_s7a CASCADE.
#
# The stats, series and traces cases use fixed times from a 2026-10-18 snapshot (T0 17:00 UTC): they mean something
# only on a copy that holds data around those times. Observers are picked by role among the newest 5,000,000
# observation ids (200,000 telemetry ids, about 10K rows), and their cursors from their own rows: a telemetry "amid"
# cursor is the median id of the observer's rows in the case's window, an adverts cursor comes from its adverts.
# Quiet observers have adverts among the newest ids and fewer than 51 in all, so their first page is short.
batches:
  - name: stats
    search_path: public
    statements:
      old_tn: "old:GetTopNodes"
      new_tn: "new:GetTopNodesProbe"
      old_ta: "old:GetStatsTopAdvertisers"
      new_ta: "new:GetStatsTopAdvertisersProbe"
      old_pa: "old:GetPathStats"
      new_pa: "new:GetPathStatsProbe"
    pairs:
      - id: tn.000.none_1d_l10
        ref: {stmt: old_tn, params: [{raw: "'2026-10-17 17:00+00'::timestamptz"}, {raw: "NULL::bpchar[]"}, {raw: "10"}]}
        cands:
          - {stmt: new_tn, params: [{raw: "'2026-10-17 17:00+00'::timestamptz"}, {raw: "NULL::bpchar[]"}, {raw: "10"}]}
        expect: {new_tn: identical}
      - id: tn.001.none_7d_l10
        ref: {stmt: old_tn, params: [{raw: "'2026-10-11 17:00+00'::timestamptz"}, {raw: "NULL::bpchar[]"}, {raw: "10"}]}
