# A derived statement: the read-only part of a DML, frozen as a file and checked against today's sqlc text.
statements:
  DeleteExpiredRoutes: {sqlc: DeleteExpiredRoutes, plan: maint, kind: dml}
  DeleteExpiredRoutesSelect:
    file: sql/derived/DeleteExpiredRoutesSelect.sql
    derived_from: DeleteExpiredRoutes
    plan: maint
entries:
  - {id: expired.plain, stmt: DeleteExpiredRoutes}
  - {id: expired.select, stmt: DeleteExpiredRoutesSelect}
