# GetNodeByID fully covered, plus a pending cached statement that is left out without an error.
statements:
  GetNodeByID: {sqlc: GetNodeByID, plan: cached, admission: by_id}
  NotYet: {sqlc: NotMergedYet, plan: cached, admission: by_id, pending: some_feature}
admission_profiles:
  by_id: [hit, miss]
entries:
  - {id: node.hit, stmt: GetNodeByID, shapes: [hit], params: ["00000000-0000-0000-0000-000000000001"]}
  - {id: node.miss, stmt: GetNodeByID, shapes: [miss], params: ["00000000-0000-0000-0000-000000000000"]}
  - {id: notyet.one, stmt: NotYet, params: [1]}
