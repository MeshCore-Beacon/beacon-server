# A hop statement marked cached whose entries cover the global_page shapes only: rare_hop and absent_hop are missing.
statements:
  ListKnownRoutesGlobalHop: {sqlc: ListKnownRoutesGlobalHop, plan: cached, admission: global_page}
admission_profiles:
  global_page: [page1, deep, tie]
entries:
  - {id: gh.page1, stmt: ListKnownRoutesGlobalHop, shapes: [page1], params: [6, null, 0, false, 50]}
  - {id: gh.deep, stmt: ListKnownRoutesGlobalHop, shapes: [deep], params: [6, "2026-01-01 00:00:00+00", 0, false, 50]}
  - {id: gh.tie, stmt: ListKnownRoutesGlobalHop, shapes: [tie], params: [6, "2026-01-01 00:00:00+00", 10, false, 50]}
