# A cached statement read from a frozen file: only sqlc statements are served, so it cannot be admitted.
statements:
  Frozen: {file: sql/harness/H.sql, plan: cached, admission: by_id}
admission_profiles:
  by_id: [hit, miss]
entries:
  - {id: frozen.hit, stmt: Frozen, shapes: [hit, miss], params: [1]}
